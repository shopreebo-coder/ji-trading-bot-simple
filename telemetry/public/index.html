<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOREX ENGINE PRO — Telemetry</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
a{color:#58a6ff;text-decoration:none}

/* header */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hdr h1{font-size:15px;font-weight:600;color:#58a6ff;letter-spacing:.3px}
.hdr .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#3fb950}
.dot.stopped{background:#f85149}
.dot.starting{background:#d29922;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ts{font-size:11px;color:#484f58}

/* tabs */
.tabs{display:flex;gap:2px;background:#161b22;border-bottom:1px solid #30363d;padding:0 24px}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#8b949e;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:#e6edf3}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}

/* layout */
.page{padding:20px 24px;max-width:1400px;margin:0 auto}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-bottom:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:13px 15px}
.card .lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.card .val{font-size:24px;font-weight:700}
.val.blue{color:#58a6ff}.val.green{color:#3fb950}.val.red{color:#f85149}.val.yellow{color:#d29922}

/* grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}

/* panel */
.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;margin-bottom:16px}
.ph{padding:9px 15px;border-bottom:1px solid #30363d;font-size:11px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.pb{overflow-y:auto;max-height:320px}
.pb.short{max-height:220px}

/* table */
table{width:100%;border-collapse:collapse}
th{background:#0d1117;color:#8b949e;font-size:10px;font-weight:600;text-transform:uppercase;padding:7px 13px;text-align:left;position:sticky;top:0;z-index:1}
td{padding:7px 13px;border-bottom:1px solid #21262d;font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1c2128}

/* tags / badges */
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;line-height:18px}
.buy{background:#1a3a26;color:#3fb950}.sell{background:#3a1a1a;color:#f85149}
.be{background:#1a2e3a;color:#58a6ff}
.ok{background:#1a3a26;color:#3fb950}.fail{background:#3a1a1a;color:#f85149}
.accepted{background:#1a3a26;color:#3fb950}.rejected{background:#3a2a00;color:#d29922}

/* pips colors */
.pp{color:#3fb950;font-weight:600}.pn{color:#f85149;font-weight:600}.pz{color:#8b949e}

/* empty state */
.empty{color:#484f58;padding:18px;text-align:center;font-size:12px}

/* decision card */
.dcard{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:13px 15px;margin-bottom:10px}
.dcard .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dcard .sym{font-weight:700;font-size:14px;color:#e6edf3}
.dcard .time{font-size:10px;color:#484f58}
.dcard .conditions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px;margin-top:8px}
.cond{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:#161b22;border-radius:4px;font-size:11px}
.cond .cname{color:#8b949e}
.cond .cv.t{color:#3fb950}.cond .cv.f{color:#f85149}

/* export btn */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#e6edf3;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none}
.btn:hover{background:#30363d}
.btn.primary{background:#1f4a2e;border-color:#3fb950;color:#3fb950}
.btn.primary:hover{background:#2a6040}

/* chart container */
.chart-wrap{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:16px}
.chart-wrap h3{font-size:11px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.chart-wrap canvas{max-height:220px}

/* log */
.logbox{background:#0d1117;border:1px solid #30363d;border-radius:8px;height:180px;overflow-y:auto;padding:8px 12px;font-family:monospace;font-size:11px;color:#8b949e}
.ll{padding:1px 0;white-space:pre-wrap;word-break:break-all}
.ll.t{color:#3fb950}.ll.x{color:#f85149}.ll.b{color:#d29922}.ll.e{color:#58a6ff}

/* loading */
.loading{text-align:center;padding:40px;color:#484f58;font-size:13px}

/* bar: block breakdown */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-row .blbl{width:130px;font-size:11px;color:#8b949e;text-align:right;flex-shrink:0}
.bar-row .btrack{flex:1;background:#21262d;border-radius:3px;height:12px;overflow:hidden}
.bar-row .bfill{height:100%;border-radius:3px;background:#58a6ff;transition:width .4s}
.bar-row .bval{width:45px;font-size:11px;color:#e6edf3;text-align:right;flex-shrink:0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── helpers ────────────────────────────────────────────────────────────────
function hms(iso){ return new Date(iso).toUTCString().slice(17,25); }
function hm(iso){ return new Date(iso).toUTCString().slice(17,22); }
function fmtDate(iso){ return iso ? iso.slice(0,10) : ""; }
function fmtPips(v){
  v = parseFloat(v);
  if(isNaN(v)) return <span className="pz">—</span>;
  return <span className={v>0?"pp":v<0?"pn":"pz"}>{v>0?"+":""}{v.toFixed(2)}</span>;
}
function minsOpen(t){ return ((Date.now()-t)/60000).toFixed(1); }

async function api(path){ const r=await fetch(path); return r.json(); }

// ── Top header ─────────────────────────────────────────────────────────────
function Header({ botStatus, ts }){
  return (
    <div className="hdr">
      <span className={`dot ${botStatus==="running"?"":"stopped"}`}/>
      <h1>FOREX ENGINE PRO v39.1 — Telemetry</h1>
      <div className="right">
        <span className="ts">{ts ? `updated ${hms(ts)} UTC` : "connecting…"}</span>
      </div>
    </div>
  );
}

// ── Tabs ───────────────────────────────────────────────────────────────────
const TABS = ["LIVE","ANALIZA","WYKRESY","DECYZJE","WZORCE","EXCURSION"];
function Tabs({ active, set }){
  return (
    <div className="tabs">
      {TABS.map(t => <div key={t} className={`tab ${active===t?"active":""}`} onClick={()=>set(t)}>{t}</div>)}
    </div>
  );
}

// ── LIVE tab ───────────────────────────────────────────────────────────────
function LiveTab({ live, today, logLines }){
  const [tick, setTick] = useState(0);
  useEffect(()=>{ const id=setInterval(()=>setTick(x=>x+1),3000); return()=>clearInterval(id); },[]);

  const trades = live.openTrades || [];
  const blocks = live.recentBlocks || [];

  return (
    <div className="page">
      <div className="cards">
        <div className="card"><div className="lbl">Bot Status</div>
          <div className={`val ${live.botStatus==="running"?"green":"red"}`}>{live.botStatus||"—"}</div></div>
        <div className="card"><div className="lbl">Open Trades</div>
          <div className="val blue">{trades.length}</div></div>
        <div className="card"><div className="lbl">Daily Trades</div>
          <div className="val">{live.dailyTrades||0}</div></div>
        <div className="card"><div className="lbl">Today Wins</div>
          <div className="val green">{today.wins||0}</div></div>
        <div className="card"><div className="lbl">Today Losses</div>
          <div className="val red">{today.losses||0}</div></div>
        <div className="card"><div className="lbl">Breakeven</div>
          <div className="val yellow">{today.breakevens||0}</div></div>
        <div className="card" title="WIN / (WIN + LOSS) — breakeveny nie liczą się do mianownika"><div className="lbl">Win Rate W/(W+L)</div>
          <div className="val">{today.winRate||"0.0"}%</div></div>
        <div className="card"><div className="lbl">Avg Peak</div>
          <div className="val">{today.avgPeak||"0.00"} p</div></div>
      </div>

      <div className="g2">
        <div className="panel">
          <div className="ph">Open Positions <span>{trades.length}</span></div>
          <div className="pb">
            {trades.length===0 ? <div className="empty">No open trades</div> : (
              <table><thead><tr>
                <th>Symbol</th><th>Side</th><th>Pips</th><th>Peak</th><th>BE</th><th>Open</th>
              </tr></thead><tbody>
                {trades.map(t=>(
                  <tr key={t.symbol}>
                    <td><b>{t.symbol}</b></td>
                    <td><span className={`tag ${t.side}`}>{t.side.toUpperCase()}</span></td>
                    <td>{fmtPips(t.pips)}</td>
                    <td>{fmtPips(t.peak)}</td>
                    <td>{t.breakEven?<span className="tag be">BE</span>:""}</td>
                    <td>{minsOpen(t.entryTime)} m</td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>

        <div className="panel">
          <div className="ph">Active Blocks <span>{blocks.length}</span></div>
          <div className="pb short">
            {blocks.length===0 ? <div className="empty">No blocks</div> : (
              <table><thead><tr><th>UTC</th><th>Event</th></tr></thead><tbody>
                {blocks.map((b,i)=>(
                  <tr key={i}><td className="pz">{hms(b.t)}</td><td>{b.line}</td></tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="ph">Live Log</div>
        <div className="logbox" id="livelog">
          {logLines.map((l,i)=>(
            <div key={i} className={`ll${l.line.startsWith("Trade ->")||l.line.includes("CONFIRMED")?" t":l.line.startsWith("EXIT")?" x":l.line.includes("BLOCK")?" b":l.line.includes("BREAK EVEN")?" e":""}`}>
              {hms(l.t)} {l.line}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── ANALIZA tab ────────────────────────────────────────────────────────────
function AnalyzaTab({ stats, today, symbols }){
  const totalBlocks = Object.values(today.blockCounts||{}).reduce((a,b)=>a+b,0);
  const blockTypes = [
    {key:"spread_block",     label:"Spread"},
    {key:"pullback_block",   label:"Pullback"},
    {key:"cooldown_block",   label:"Cooldown"},
    {key:"correlation_block",label:"Correlation"},
    {key:"margin_block",     label:"Margin"},
  ];

  return (
    <div className="page">
      <div className="cards">
        <div className="card"><div className="lbl">Total Trades</div><div className="val blue">{stats.trades||0}</div></div>
        <div className="card"><div className="lbl">Wins</div><div className="val green">{stats.wins||0}</div></div>
        <div className="card"><div className="lbl">Losses</div><div className="val red">{stats.losses||0}</div></div>
        <div className="card"><div className="lbl">Breakeven</div><div className="val yellow">{stats.breakevens||0}</div></div>
        <div className="card" title="WIN / (WIN + LOSS) — breakeveny nie liczą się do mianownika"><div className="lbl">Win Rate W/(W+L)</div><div className="val">{stats.winRate||"0.0"}%</div></div>
        <div className="card"><div className="lbl">Avg Peak</div><div className="val">{stats.avgPeak||"0.00"} p</div></div>
        <div className="card"><div className="lbl">Avg Duration</div><div className="val">{stats.avgDuration||"0.0"} m</div></div>
        <div className="card"><div className="lbl">Checks</div><div className="val yellow">{stats.checksTotal||0}</div></div>
      </div>

      <div className="g2">
        <div className="panel">
          <div className="ph">Block Breakdown — Today</div>
          <div style={{padding:"16px"}}>
            {blockTypes.map(({key,label})=>{
              const n = (today.blockCounts||{})[key]||0;
              const pct = totalBlocks>0 ? Math.round(n/totalBlocks*100) : 0;
              return (
                <div className="bar-row" key={key}>
                  <div className="blbl">{label}</div>
                  <div className="btrack"><div className="bfill" style={{width:pct+"%"}}/></div>
                  <div className="bval">{n} <span className="pz">({pct}%)</span></div>
                </div>
              );
            })}
            {totalBlocks===0&&<div className="empty">No blocks today</div>}
          </div>
        </div>

        <div className="panel">
          <div className="ph">Performance per Symbol</div>
          <div className="pb">
            {symbols.length===0 ? <div className="empty">No data</div> : (
              <table><thead><tr>
                <th>Symbol</th><th>Trades</th><th>Win%</th><th>Avg P</th><th>Avg Peak</th>
              </tr></thead><tbody>
                {symbols.map(s=>(
                  <tr key={s.symbol}>
                    <td><b>{s.symbol}</b></td>
                    <td>{s.trades}</td>
                    <td><span className={parseFloat(s.winRate)>=50?"pp":"pn"}>{s.winRate}%</span></td>
                    <td>{fmtPips(s.avgProfit)}</td>
                    <td>{fmtPips(s.avgPeak)}</td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Chart helpers ──────────────────────────────────────────────────────────
const CHART_OPTS_BASE = {
  responsive:true,
  maintainAspectRatio:true,
  plugins:{ legend:{ labels:{ color:"#8b949e", font:{size:11} } } },
  scales:{
    x:{ ticks:{ color:"#8b949e", font:{size:10} }, grid:{ color:"#21262d" } },
    y:{ ticks:{ color:"#8b949e", font:{size:10} }, grid:{ color:"#21262d" } },
  },
};

function EquityChart({ trades }){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current||!trades.length) return;
    if(chartRef.current) chartRef.current.destroy();
    let cum=0;
    const points = trades
      .filter(t=>t.close)
      .sort((a,b)=>a.open.timestamp>b.open.timestamp?1:-1)
      .map(t=>{ cum+=t.close.profitPips||0; return {x:hm(t.close.timestamp||t.open.timestamp),y:parseFloat(cum.toFixed(2))}; });
    chartRef.current = new Chart(ref.current, {
      type:"line",
      data:{ labels:points.map(p=>p.x), datasets:[{
        label:"Cumulative pips", data:points.map(p=>p.y),
        borderColor:"#58a6ff", backgroundColor:"rgba(88,166,255,.08)",
        tension:.3, pointRadius:2, fill:true,
      }]},
      options:{ ...CHART_OPTS_BASE, plugins:{...CHART_OPTS_BASE.plugins, legend:{display:false}} },
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[trades]);
  if(!trades.length) return <div className="empty">No closed trades yet</div>;
  return <canvas ref={ref}/>;
}

function BarChart({ labels, values, color="#58a6ff", label="Value", extra={} }){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current||!labels.length) return;
    if(chartRef.current) chartRef.current.destroy();
    const baseOpts = { ...CHART_OPTS_BASE, plugins:{...CHART_OPTS_BASE.plugins, legend:{display:false}} };
    function deepMerge(a, b){
      const out = {...a};
      for(const k of Object.keys(b||{})){
        if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")
          out[k] = deepMerge(a[k], b[k]);
        else out[k] = b[k];
      }
      return out;
    }
    chartRef.current = new Chart(ref.current, {
      type:"bar",
      data:{ labels, datasets:[{ label, data:values, backgroundColor:color, borderRadius:4 }]},
      options: deepMerge(baseOpts, extra),
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[labels,values,color,label,extra]);
  if(!labels.length) return <div className="empty">No data</div>;
  return <canvas ref={ref}/>;
}

function WinRateChart({ title, buckets, noDataMsg }){
  if(!buckets||buckets.length===0) return (
    <div className="chart-wrap">
      <h3>{title}</h3>
      <p style={{color:"#8b949e",fontSize:12,textAlign:"center",marginTop:40}}>{noDataMsg||"Brak danych — za mało transakcji"}</p>
    </div>
  );
  const labels = buckets.map(b=>b.key);
  const values = buckets.map(b=>b.winRate);
  const counts = buckets.map(b=>b.trades);
  const colors = values.map(v=>v>=50?"rgba(63,185,80,.7)":"rgba(248,81,73,.7)");
  return (
    <div className="chart-wrap">
      <h3>{title}</h3>
      <BarChart
        labels={labels}
        values={values}
        color={colors}
        label="Win rate %"
        extra={{
          plugins:{
            tooltip:{
              callbacks:{
                afterLabel: (ctx)=>`  Transakcji: ${counts[ctx.dataIndex]}`
              }
            }
          },
          scales:{ y:{ min:0, max:100, ticks:{ callback: v=>v+"%" } } }
        }}
      />
    </div>
  );
}

function WykreśyTab({ symbols, trades, winrate }){
  // hour histogram from open trades
  const hourCounts = Array(24).fill(0);
  trades.filter(t=>t.open?.timestamp).forEach(t=>{
    const h = new Date(t.open.timestamp).getUTCHours();
    hourCounts[h]++;
  });

  const symLabels  = symbols.map(s=>s.symbol.replace("_",""));
  const symProfit  = symbols.map(s=>parseFloat(s.avgProfit));
  const symWinRate = symbols.map(s=>parseFloat(s.winRate));
  const profitColors = symProfit.map(v=>v>=0?"rgba(63,185,80,.7)":"rgba(248,81,73,.7)");

  const wr = winrate || {};

  return (
    <div className="page">
      <div className="g2">
        <div className="chart-wrap">
          <h3>Equity Curve (cumulative pips)</h3>
          <EquityChart trades={trades}/>
        </div>
        <div className="chart-wrap">
          <h3>Trade Distribution by Hour (UTC)</h3>
          <BarChart
            labels={Array.from({length:24},(_,i)=>i+":00")}
            values={hourCounts}
            color="rgba(88,166,255,.7)"
            label="Trades"
          />
        </div>
      </div>
      <div className="g2">
        <div className="chart-wrap">
          <h3>Avg Profit per Pair (pips)</h3>
          <BarChart labels={symLabels} values={symProfit} color={profitColors} label="Avg profit"/>
        </div>
        <div className="chart-wrap">
          <h3>Win Rate per Pair — per-pair stats (%)</h3>
          <BarChart
            labels={symLabels}
            values={symWinRate}
            color={symWinRate.map(v=>v>=50?"rgba(63,185,80,.7)":"rgba(248,81,73,.7)")}
            label="Win rate"
          />
        </div>
      </div>

      <div style={{borderTop:"1px solid #30363d",margin:"8px 0 12px",paddingTop:8}}>
        <span style={{fontSize:11,color:"#8b949e",fontWeight:600,letterSpacing:".8px",textTransform:"uppercase"}}>
          Market Regime Analysis
          {wr.totalTrades>0 && <span style={{marginLeft:8,color:"#58a6ff"}}>{wr.totalTrades} transakcji</span>}
        </span>
      </div>

      <div className="g2">
        <WinRateChart title="Win Rate vs ATR (pipy)" buckets={wr.atrBuckets}/>
        <WinRateChart title="Win Rate vs Godzina UTC" buckets={wr.hourBuckets}/>
      </div>
      <div className="g2">
        <WinRateChart title="Win Rate vs Spread (pipy)" buckets={wr.spreadBuckets}/>
        <WinRateChart title="Win Rate vs Symbol" buckets={wr.symbolBuckets}/>
      </div>
    </div>
  );
}

// ── DECYZJE tab ────────────────────────────────────────────────────────────
const CHECK_KEYS = ["trend","candle","ema","strength","m1trend","m1candle","m1prev","m1close"];

function DecisionCard({ ev }){
  const d = ev.data;
  const side = ev.type === "buy_check" ? "buy" : "sell";
  const conditions = CHECK_KEYS.map(k=>({ key:k, val: d[k] }));
  const accepted = conditions.every(c=>c.val===true);
  const rejected = !accepted;
  const failReasons = conditions.filter(c=>c.val===false).map(c=>c.key);

  return (
    <div className="dcard">
      <div className="dhead">
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span className="sym">{d.symbol}</span>
          <span className={`tag ${side}`}>{side.toUpperCase()} CHECK</span>
          <span className={`tag ${accepted?"accepted":"rejected"}`}>{accepted?"ACCEPTED":"REJECTED"}</span>
        </div>
        <span className="time">{hms(d.ts||ev.ts)} UTC</span>
      </div>
      {rejected && failReasons.length>0 && (
        <div style={{marginBottom:8,fontSize:11,color:"#d29922"}}>
          Rejected: {failReasons.join(", ")}
        </div>
      )}
      <div className="conditions">
        {conditions.map(({key,val})=>(
          <div className="cond" key={key}>
            <span className="cname">{key}</span>
            <span className={`cv ${val?"t":"f"}`}>{val?"✓":"✗"}</span>
          </div>
        ))}
        {d.entryDistance!=null&&(
          <div className="cond">
            <span className="cname">entry dist</span>
            <span className="cv t">{parseFloat(d.entryDistance).toFixed(2)} p</span>
          </div>
        )}
        {d.spread!=null&&(
          <div className="cond">
            <span className="cname">spread</span>
            <span className="cv t">{parseFloat(d.spread).toFixed(2)} p</span>
          </div>
        )}
      </div>
    </div>
  );
}

  const [filter, setFilter] = useState("all");

  return (
    <div className="page">

              borderColor:filter===f?"#58a6ff":"#30363d",

const FP_LABELS = ["trend","candle","ema","strength","m1trend","m1prev"];

function FpBadge({ fp }){
  if(!fp) return null;
  const vals = Object.entries(fp);
  return (
    <span style={{display:"inline-flex",gap:3,flexWrap:"wrap"}}>
      {vals.map(([k,v])=>(
        <span key={k} title={k} style={{
          fontSize:10,padding:"1px 5px",borderRadius:3,fontWeight:600,
          background: v?"rgba(63,185,80,.15)":"rgba(248,81,73,.12)",
          color:       v?"#3fb950":"#f85149",
          border:`1px solid ${v?"#3fb95040":"#f8514940"}`,
        }}>{k.toUpperCase().slice(0,3)}</span>

function FpTable({ title, rows, accent }){
  if(!rows||rows.length===0) return (
    <div style={{background:"#161b22",border:"1px solid #30363d",borderRadius:8,padding:16,marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:600,color:"#8b949e",textTransform:"uppercase",letterSpacing:".8px",marginBottom:12}}>{title}</div>
      <div className="empty" style={{padding:"24px 0"}}>Brak danych — za mało transakcji</div>
    </div>
  );
  return (
    <div style={{background:"#161b22",border:"1px solid #30363d",borderRadius:8,padding:16,marginBottom:16,overflowX:"auto"}}>
      <div style={{fontSize:11,fontWeight:600,color:"#8b949e",textTransform:"uppercase",letterSpacing:".8px",marginBottom:12}}>
        {title}
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead>
          <tr style={{color:"#8b949e",textAlign:"left"}}>
            <th style={{padding:"4px 8px",fontWeight:600}}>#</th>
            <th style={{padding:"4px 8px",fontWeight:600}}>Hash</th>
            <th style={{padding:"4px 8px",fontWeight:600}}>Warunki</th>
            <th style={{padding:"4px 8px",fontWeight:600,textAlign:"right"}}>Win%</th>
            <th style={{padding:"4px 8px",fontWeight:600,textAlign:"right"}}>W/L</th>
            <th style={{padding:"4px 8px",fontWeight:600,textAlign:"right"}}>Avg pip</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r,i)=>(
            <tr key={r.fingerprint} style={{borderTop:"1px solid #21262d",background:i%2===0?"transparent":"rgba(255,255,255,.02)"}}>
              <td style={{padding:"5px 8px",color:"#484f58"}}>{i+1}</td>
              <td style={{padding:"5px 8px"}}>
                <code style={{fontSize:13,letterSpacing:2,color:accent,fontWeight:700}}>{r.fingerprint}</code>
              </td>
              <td style={{padding:"5px 8px"}}><FpBadge fp={r.fpDetail}/></td>
              <td style={{padding:"5px 8px",textAlign:"right",fontWeight:700,color:r.winRate>=50?"#3fb950":"#f85149"}}>{r.winRate}%</td>
              <td style={{padding:"5px 8px",textAlign:"right",color:"#8b949e"}}>{r.wins}/{r.losses}</td>
              <td style={{padding:"5px 8px",textAlign:"right",color:r.avgPips>=0?"#3fb950":"#f85149",fontWeight:600}}>{r.avgPips>0?"+":""}{r.avgPips}</td>
            </tr>

        </tbody>
      </table>
    </div>
  );
}

function WzorceTab({ fingerprints }){

  const meta = fp.totalTrades > 0

      <div className="g2">

// ── EXCURSION tab ──────────────────────────────────────────────────────────
// Dual-dataset bar chart for WIN vs LOSS comparison
function CompareBarChart({ labels, winsData, lossesData }){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: "bar",
      data: {
        labels,
        datasets: [
          { label:"WIN",  data: winsData,   backgroundColor:"rgba(63,185,80,.75)",  borderRadius:3 },
          { label:"LOSS", data: lossesData, backgroundColor:"rgba(248,81,73,.65)", borderRadius:3 },
        ],
      },
      options: {
        responsive:true,
        plugins:{ legend:{ labels:{ color:"#8b949e", boxWidth:12 } } },
        scales:{
          x:{ ticks:{color:"#8b949e"}, grid:{color:"#21262d"} },
          y:{ ticks:{color:"#8b949e"}, grid:{color:"#21262d"} },
        },
      },
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[labels,winsData,lossesData]);
  return <canvas ref={ref}/>;
}

function ExcursionTab({ exc }){
  const e    = exc || {};
  const fmt  = v => v != null ? parseFloat(v).toFixed(2) : "—";
  const fmtM = v => v != null ? parseFloat(v).toFixed(1)+" m" : "—";

  const allMFE   = e.allMFE   || {};
  const allMAE   = e.allMAE   || {};
  const winMFE   = e.winMFE   || {};
  const lossMFE  = e.lossMFE  || {};
  const winMAE   = e.winMAE   || {};
  const lossMAE  = e.lossMAE  || {};
  const timing   = e.timing   || {};
  const mfeHist  = e.mfeHist  || [];
  const maeHist  = e.maeHist  || [];

  const noExcData = !mfeHist.length && !maeHist.length;

  // Comparison chart data
  const cmpLabels = ["MFE avg","MFE max","MAE avg","MAE min"];
  const cmpWins   = [winMFE.avg, winMFE.max, winMAE.avg, winMAE.min];
  const cmpLosses = [lossMFE.avg, lossMFE.max, lossMAE.avg, lossMAE.min];

  return (
    <div className="page">

      {/* ── diagnostic banner if no excursion data yet ── */}
      {noExcData && (
        <div style={{background:"#1c2128",border:"1px solid #d29922",borderRadius:8,padding:"14px 18px",marginBottom:20,fontSize:12,color:"#d29922"}}>
          <strong>Brak danych MFE/MAE</strong> — te pola pojawią się dopiero po zamknięciu pierwszego trade'a przez nową wersję bota.
          Historyczne eventy sprzed aktualizacji nie zawierają pól <code>mfe</code> / <code>mae</code>.
        </div>
      )}

      {/* ── summary cards ── */}
      <div className="cards">
        <div className="card" title="Max Favorable Excursion — max zysk nierozliczony w pipach">
          <div className="lbl">Avg MFE</div>
          <div className="val blue">{fmt(allMFE.avg)} p</div>
        </div>
        <div className="card" title="Max Adverse Excursion — max nierozliczona strata w pipach">
          <div className="lbl">Avg MAE</div>
          <div className="val red">{fmt(allMAE.avg)} p</div>
        </div>
        <div className="card" title="MFE / |MAE| — ratio > 1 oznacza że trade 'widział' więcej zysku niż straty">
          <div className="lbl">MFE/MAE ratio</div>
          <div className={`val ${e.mfeMAERatio!=null&&e.mfeMAERatio>=1?"green":"red"}`}>
            {e.mfeMAERatio != null ? e.mfeMAERatio : "—"}
          </div>
        </div>
        <div className="card"><div className="lbl">MFE max</div><div className="val">{fmt(allMFE.max)} p</div></div>
        <div className="card"><div className="lbl">MAE min</div><div className="val red">{fmt(allMAE.min)} p</div></div>
        <div className="card" title="Ile minut od otwarcia aż pips > 0 po raz pierwszy">
          <div className="lbl">Avg → Profit</div>
          <div className="val">{fmtM(timing.timeToProfit?.avg)}</div>
        </div>
        <div className="card" title="Ile minut od otwarcia aż pips < 0 po raz pierwszy">
          <div className="lbl">Avg → Drawdown</div>
          <div className="val">{fmtM(timing.timeToDd?.avg)}</div>
        </div>
        <div className="card" title="Ile minut od otwarcia do aktywacji break-even SL">
          <div className="lbl">Avg BE timing</div>
          <div className="val yellow">{fmtM(timing.breakEven?.avg)}</div>
        </div>
      </div>

      {/* ── histograms ── */}
      <div className="g2">
        <div className="chart-wrap">
          <h3>MFE histogram — rozkład max zysku (pipy)</h3>
          {mfeHist.length
            ? <BarChart
                labels={mfeHist.map(b=>b.bucket+"p")}
                values={mfeHist.map(b=>b.count)}
                color="rgba(63,185,80,.75)"
                label="Transakcji"
              />
            : <div className="empty">Brak danych</div>
          }
        </div>
        <div className="chart-wrap">
          <h3>MAE histogram — rozkład max straty (pipy)</h3>
          {maeHist.length
            ? <BarChart
                labels={maeHist.map(b=>b.bucket+"p")}
                values={maeHist.map(b=>b.count)}
                color="rgba(248,81,73,.65)"
                label="Transakcji"
              />
            : <div className="empty">Brak danych</div>
          }
        </div>
      </div>

      {/* ── win vs loss comparison ── */}
      <div className="g2">
        <div className="chart-wrap">
          <h3>WIN vs LOSS — porównanie excursion</h3>
          {(winMFE.avg != null || lossMFE.avg != null)
            ? <CompareBarChart labels={cmpLabels} winsData={cmpWins} lossesData={cmpLosses}/>
            : <div className="empty">Brak danych</div>
          }
        </div>
        <div className="panel" style={{marginBottom:0}}>
          <div className="ph">Timing szczegółowy</div>
          <div style={{padding:"16px"}}>
            {[
              ["Time to Profit avg",  timing.timeToProfit?.avg, "m",  "#3fb950"],
              ["Time to Profit min",  timing.timeToProfit?.min, "m",  "#3fb950"],
              ["Time to Profit max",  timing.timeToProfit?.max, "m",  "#3fb950"],
              ["Time to Drawdown avg",timing.timeToDd?.avg,     "m",  "#f85149"],
              ["Time to Drawdown min",timing.timeToDd?.min,     "m",  "#f85149"],
              ["Break-even avg",      timing.breakEven?.avg,    "m",  "#d29922"],
              ["Break-even min",      timing.breakEven?.min,    "m",  "#d29922"],
              ["Break-even max",      timing.breakEven?.max,    "m",  "#d29922"],
            ].map(([lbl, val, unit, col])=>(
              <div key={lbl} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #21262d",fontSize:12}}>
                <span style={{color:"#8b949e"}}>{lbl}</span>
                <span style={{fontWeight:700,color:val!=null?col:"#484f58"}}>
                  {val != null ? parseFloat(val).toFixed(1)+unit : "—"}
                </span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── WIN vs LOSS breakdown table ── */}
      <div className="panel">
        <div className="ph">WIN vs LOSS — excursion breakdown</div>
        <table>
          <thead><tr>
            <th>Metric</th>
            <th style={{textAlign:"right",color:"#3fb950"}}>WIN ({e.wins||0})</th>
            <th style={{textAlign:"right",color:"#f85149"}}>LOSS ({e.losses||0})</th>
            <th style={{textAlign:"right"}}>ALL ({e.totalTrades||0})</th>
          </tr></thead>
          <tbody>
            {[
              ["MFE avg (p)", winMFE.avg, lossMFE.avg, allMFE.avg],
              ["MFE max (p)", winMFE.max, lossMFE.max, allMFE.max],
              ["MAE avg (p)", winMAE.avg, lossMAE.avg, allMAE.avg],
              ["MAE min (p)", winMAE.min, lossMAE.min, allMAE.min],
            ].map(([label, wv, lv, av])=>(
              <tr key={label}>
                <td style={{color:"#8b949e"}}>{label}</td>
                <td style={{textAlign:"right",color:"#3fb950"}}>{wv!=null?parseFloat(wv).toFixed(2):"—"}</td>
                <td style={{textAlign:"right",color:"#f85149"}}>{lv!=null?parseFloat(lv).toFixed(2):"—"}</td>
                <td style={{textAlign:"right"}}>{av!=null?parseFloat(av).toFixed(2):"—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

    </div>
  );
}

// ── Export button ──────────────────────────────────────────────────────────

      <span style={{fontSize:11,color:"#8b949e",marginRight:4}}>Export:</span>
      <a className="btn primary" href={`/api/export?date=today&format=json`} download={`forex_${today}.json`}>⬇ JSON</a>
      <a className="btn" href={`/api/export?date=today&format=csv`} download={`forex_${today}.csv`}>⬇ CSV</a>
      <span style={{fontSize:11,color:"#484f58",marginLeft:8}}>today ({today})</span>
    </div>

}

// ── App root ───────────────────────────────────────────────────────────────
function App(){
  const [tab, setTab]         = useState("LIVE");
  const [live, setLive]       = useState({ botStatus:"starting", dailyTrades:0, openTrades:[], recentBlocks:[] });
  const [today, setToday]     = useState({});
  const [stats, setStats]     = useState({});
  const [symbols, setSymbols] = useState([]);
  const [trades, setTrades]   = useState([]);
  const [checks, setChecks]   = useState([]);
  const [logLines, setLog]    = useState([]);
  const [lastTs, setLastTs]   = useState(null);
  const [winrate, setWinrate]           = useState({});
  const [fingerprints, setFingerprints] = useState({});
  const [excursion, setExcursion]       = useState({});

  // fetch data
  const refresh = useCallback(async()=>{
    try {
      const [t,s,sym,tr] = await Promise.all([
        api("/api/today"),
        api("/api/stats"),
        api("/api/symbols"),
        api("/api/trades?date=today"),
      ]);
      setToday(t); setStats(s); setSymbols(sym); setTrades(tr);

      const [sells, buys, wr, fps, exc] = await Promise.all([
        api("/api/events?type=sell_check&date=today&limit=200").catch(()=>[]),
        api("/api/events?type=buy_check&date=today&limit=200").catch(()=>[]),
        api("/api/winrate-analysis").catch(()=>({})),
        api("/api/fingerprints").catch(()=>({})),
        api("/api/excursion").catch(()=>({})),
      ]);
      const all = [...buys,...sells].sort((a,b)=>b.ts.localeCompare(a.ts));
      setChecks(all);
      setWinrate(wr);
      setFingerprints(fps);
      setExcursion(exc);

      setLastTs(new Date().toISOString());
    } catch(e){ console.error("refresh error",e); }
  },[]);

  // initial + periodic refresh
  useEffect(()=>{
    refresh();
    const id = setInterval(refresh, 30000);
    return ()=>clearInterval(id);
  },[refresh]);

  // SSE
  useEffect(()=>{
    const es = new EventSource("/api/events/stream");
    es.onmessage = (ev)=>{
      const msg = JSON.parse(ev.data);
      setLastTs(new Date().toISOString());

      if(msg.source==="live"){
        if(msg.type==="init"){
          setLive(msg.live||{});
        } else if(msg.type==="pips"){
          setLive(prev=>({
            ...prev,
            openTrades: prev.openTrades.map(t=>t.symbol===msg.symbol?{...t,pips:msg.pips}:t)
          }));
        } else if(msg.type==="trade_opened"){
          setLive(prev=>({
            ...prev,
            openTrades:[...prev.openTrades,{symbol:msg.symbol,side:msg.side,pips:0,peak:0,breakEven:false,entryTime:Date.now()}]
          }));
          refresh();
        } else if(msg.type==="trade_closed"){
          setLive(prev=>({...prev,openTrades:prev.openTrades.filter(t=>t.symbol!==msg.symbol)}));
          refresh();
        } else if(msg.type==="bot_status"){
          setLive(prev=>({...prev,botStatus:msg.status}));
        } else if(msg.type==="daily_count"){
          setLive(prev=>({...prev,dailyTrades:msg.value}));
        } else if(msg.type==="block"){
          setLive(prev=>({...prev,recentBlocks:[{t:new Date().toISOString(),line:msg.line},...(prev.recentBlocks||[])].slice(0,20)}));
        }
      }

      if(msg.source==="db"){
        const t=msg.type;
        const line = t+" "+(msg.symbol||"")+" "+(msg.data?.reason||"");
        setLog(prev=>[...prev,{t:msg.ts,line:line.trim()}].slice(-200));
        if(t==="buy_check"||t==="sell_check"){
          setChecks(prev=>[{...msg,data:msg.data||{}},...prev].slice(0,300));
        }
        if(t==="trade_open"||t==="trade_close"){
          refresh();
        }
      }
    };
    es.onerror=()=>setLive(prev=>({...prev,botStatus:"stopped"}));
    return()=>es.close();
  },[refresh]);

  // auto-scroll log
  useEffect(()=>{
    const el=document.getElementById("livelog");
    if(el) el.scrollTop=el.scrollHeight;
  },[logLines]);

  return (
    <>
      <Header botStatus={live.botStatus} ts={lastTs}/>
      <Tabs active={tab} set={setTab}/>
      <ExportBar/>
      {tab==="LIVE"      && <LiveTab      live={live} today={today} logLines={logLines}/>}
      {tab==="ANALIZA"   && <AnalyzaTab   stats={stats} today={today} symbols={symbols}/>}
      {tab==="WYKRESY"   && <WykreśyTab   symbols={symbols} trades={trades} winrate={winrate}/>}
      {tab==="DECYZJE"   && <DecyzjeTab   checks={checks}/>}
      {tab==="WZORCE"    && <WzorceTab    fingerprints={fingerprints}/>}
      {tab==="EXCURSION" && <ExcursionTab exc={excursion}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
