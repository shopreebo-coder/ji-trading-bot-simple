<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOREX ENGINE PRO — Telemetry</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
a{color:#58a6ff;text-decoration:none}

/* header */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hdr h1{font-size:15px;font-weight:600;color:#58a6ff;letter-spacing:.3px}
.hdr .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#3fb950}
.dot.stopped{background:#f85149}
.dot.starting{background:#d29922;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ts{font-size:11px;color:#484f58}

/* tabs */
.tabs{display:flex;gap:2px;background:#161b22;border-bottom:1px solid #30363d;padding:0 24px;overflow-x:auto;flex-shrink:0}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#8b949e;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:#e6edf3}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}

/* layout */
.page{padding:20px 24px;max-width:1400px;margin:0 auto}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-bottom:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:13px 15px}
.card .lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.card .val{font-size:24px;font-weight:700}
.val.blue{color:#58a6ff}.val.green{color:#3fb950}.val.red{color:#f85149}.val.yellow{color:#d29922}

/* insight card */
.icard{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.icard .ititle{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.8px}
.icard .ivalue{font-size:18px;font-weight:700;color:#e6edf3}
.icard .isub{font-size:11px;color:#484f58}
.icard.good .ivalue{color:#3fb950}
.icard.warn .ivalue{color:#d29922}
.icard.bad  .ivalue{color:#f85149}
.icard.info .ivalue{color:#58a6ff}

/* grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* panel */
.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;margin-bottom:16px}
.ph{padding:9px 15px;border-bottom:1px solid #30363d;font-size:11px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.pb{overflow-y:auto;max-height:320px}
.pb.short{max-height:220px}

/* table */
table{width:100%;border-collapse:collapse}
th{background:#0d1117;color:#8b949e;font-size:10px;font-weight:600;text-transform:uppercase;padding:7px 13px;text-align:left;position:sticky;top:0;z-index:1}
td{padding:7px 13px;border-bottom:1px solid #21262d;font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1c2128}

/* tags / badges */
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;line-height:18px}
.buy{background:#1a3a26;color:#3fb950}.sell{background:#3a1a1a;color:#f85149}
.be{background:#1a2e3a;color:#58a6ff}
.ok{background:#1a3a26;color:#3fb950}.fail{background:#3a1a1a;color:#f85149}
.accepted{background:#1a3a26;color:#3fb950}.rejected{background:#3a2a00;color:#d29922}
.tag-session{background:#1a2540;color:#79c0ff;font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600}

/* pips colors */
.pp{color:#3fb950;font-weight:600}.pn{color:#f85149;font-weight:600}.pz{color:#8b949e}

/* empty state */
.empty{color:#484f58;padding:18px;text-align:center;font-size:12px}

/* decision card */
.dcard{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:13px 15px;margin-bottom:10px}
.dcard .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dcard .sym{font-weight:700;font-size:14px;color:#e6edf3}
.dcard .time{font-size:10px;color:#484f58}
.dcard .conditions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px;margin-top:8px}
.cond{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:#161b22;border-radius:4px;font-size:11px}
.cond .cname{color:#8b949e}
.cond .cv.t{color:#3fb950}.cond .cv.f{color:#f85149}

/* export btn */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#e6edf3;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none}
.btn:hover{background:#30363d}
.btn.primary{background:#1f4a2e;border-color:#3fb950;color:#3fb950}
.btn.primary:hover{background:#2a6040}

/* chart container */
.chart-wrap{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:16px}
.chart-wrap h3{font-size:11px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.chart-wrap canvas{max-height:220px}

/* log */
.logbox{background:#0d1117;border:1px solid #30363d;border-radius:8px;height:180px;overflow-y:auto;padding:8px 12px;font-family:monospace;font-size:11px;color:#8b949e}
.ll{padding:1px 0;white-space:pre-wrap;word-break:break-all}
.ll.t{color:#3fb950}.ll.x{color:#f85149}.ll.b{color:#d29922}.ll.e{color:#58a6ff}

/* loading */
.loading{text-align:center;padding:40px;color:#484f58;font-size:13px}

/* bar: block breakdown */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-row .blbl{width:130px;font-size:11px;color:#8b949e;text-align:right;flex-shrink:0}
.bar-row .btrack{flex:1;background:#21262d;border-radius:3px;height:12px;overflow:hidden}
.bar-row .bfill{height:100%;border-radius:3px;background:#58a6ff;transition:width .4s}
.bar-row .bval{width:45px;font-size:11px;color:#e6edf3;text-align:right;flex-shrink:0}

/* drift alert */
.drift-alert{background:#2d1f00;border:1px solid #d29922;border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:12px}
.drift-alert .da-title{color:#d29922;font-weight:700;margin-bottom:4px}
.drift-alert .da-body{color:#8b949e}

/* section divider */
.sec-divider{border-top:1px solid #30363d;margin:12px 0 16px;padding-top:8px}
.sec-label{font-size:11px;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── helpers ────────────────────────────────────────────────────────────────
function hms(iso){ return new Date(iso).toUTCString().slice(17,25); }
function hm(iso){ return new Date(iso).toUTCString().slice(17,22); }
function fmtDate(iso){ return iso ? iso.slice(0,10) : ""; }
function fmtPips(v){
  v = parseFloat(v);
  if(isNaN(v)) return <span className="pz">—</span>;
  return <span className={v>0?"pp":v<0?"pn":"pz"}>{v>0?"+":""}{v.toFixed(2)}</span>;
}
function minsOpen(t){ return ((Date.now()-t)/60000).toFixed(1); }
function pct(v){ return v==null?"—":v.toFixed(1)+"%"; }
function fmtNum(v,dec=2){ return v==null?"—":parseFloat(v).toFixed(dec); }

async function api(path){ const r=await fetch(path); return r.json(); }

// ── Top header ─────────────────────────────────────────────────────────────
function Header({ botStatus, ts }){
  return (
    <div className="hdr">
      <span className={`dot ${botStatus==="running"?"":"stopped"}`}/>
      <h1>FOREX ENGINE PRO v39.3 — Telemetry</h1>
      <div className="right">
        <span className="ts">{ts ? `updated ${hms(ts)} UTC` : "connecting…"}</span>
      </div>
    </div>
  );
}

// ── Tabs ───────────────────────────────────────────────────────────────────
const TABS = ["LIVE","ANALIZA","PIPELINE","WYKRESY","DECYZJE","WZORCE","EXCURSION","INSIGHTS","BLOCKED","EXPORT"];
function Tabs({ active, set }){
  return (
    <div className="tabs">
      {TABS.map(t => <div key={t} className={`tab ${active===t?"active":""}`} onClick={()=>set(t)}>{t}</div>)}
    </div>
  );
}

// ── LIVE tab ───────────────────────────────────────────────────────────────
function LiveTab({ live, today, logLines }){
  const [tick, setTick] = useState(0);
  useEffect(()=>{ const id=setInterval(()=>setTick(x=>x+1),3000); return()=>clearInterval(id); },[]);

  const trades = live.openTrades || [];
  const blocks = live.recentBlocks || [];

  return (
    <div className="page">
      <div className="cards">
        <div className="card"><div className="lbl">Bot Status</div>
          <div className={`val ${live.botStatus==="running"?"green":"red"}`}>{live.botStatus||"—"}</div></div>
        <div className="card"><div className="lbl">Open Trades</div>
          <div className="val blue">{trades.length}</div></div>
        <div className="card"><div className="lbl">Daily Trades</div>
          <div className="val">{live.dailyTrades||0}</div></div>
        <div className="card"><div className="lbl">Today Wins</div>
          <div className="val green">{today.wins||0}</div></div>
        <div className="card"><div className="lbl">Today Losses</div>
          <div className="val red">{today.losses||0}</div></div>
        <div className="card"><div className="lbl">Breakeven</div>
          <div className="val yellow">{today.breakevens||0}</div></div>
        <div className="card" title="WIN / (WIN + LOSS) — breakeveny nie liczą się do mianownika"><div className="lbl">Win Rate W/(W+L)</div>
          <div className="val">{today.winRate||"0.0"}%</div></div>
        <div className="card"><div className="lbl">Avg Peak</div>
          <div className="val">{today.avgPeak||"0.00"} p</div></div>
      </div>

      <div className="g2">
        <div className="panel">
          <div className="ph">Open Positions <span>{trades.length}</span></div>
          <div className="pb">
            {trades.length===0 ? <div className="empty">No open trades</div> : (
              <table><thead><tr>
                <th>Symbol</th><th>Side</th><th>Pips</th><th>Peak</th><th>BE</th><th>Open</th>
              </tr></thead><tbody>
                {trades.map(t=>(
                  <tr key={t.symbol}>
                    <td><b>{t.symbol}</b></td>
                    <td><span className={`tag ${t.side}`}>{t.side.toUpperCase()}</span></td>
                    <td>{fmtPips(t.pips)}</td>
                    <td>{fmtPips(t.peak)}</td>
                    <td>{t.breakEven?<span className="tag be">BE</span>:""}</td>
                    <td>{minsOpen(t.entryTime)} m</td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>

        <div className="panel">
          <div className="ph">Active Blocks <span>{blocks.length}</span></div>
          <div className="pb short">
            {blocks.length===0 ? <div className="empty">No blocks</div> : (
              <table><thead><tr><th>UTC</th><th>Event</th></tr></thead><tbody>
                {blocks.map((b,i)=>(
                  <tr key={i}><td className="pz">{hms(b.t)}</td><td>{b.line}</td></tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="ph">Live Log</div>
        <div className="logbox" id="livelog">
          {logLines.map((l,i)=>(
            <div key={i} className={`ll${l.line.startsWith("Trade ->")||l.line.includes("CONFIRMED")?" t":l.line.startsWith("EXIT")?" x":l.line.includes("BLOCK")?" b":l.line.includes("BREAK EVEN")?" e":""}`}>
              {hms(l.t)} {l.line}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── ANALIZA tab ────────────────────────────────────────────────────────────
function AnalyzaTab({ stats, today, symbols, confirmLag, exitMgr }){
  const totalBlocks = Object.values(today.blockCounts||{}).reduce((a,b)=>a+b,0);
  const blockTypes = [
    {key:"spread_block",         label:"Spread"},
    {key:"pullback_block",       label:"Pullback"},
    {key:"cooldown_block",       label:"Cooldown"},
    {key:"correlation_block",    label:"Correlation"},
    {key:"margin_block",         label:"Margin"},
    {key:"exhaustion_block",     label:"Exhaustion"},
    {key:"spread_edge_block",    label:"Spread Edge"},
    {key:"symbol_disabled_block",label:"Disabled Symbol"},
  ];

  return (
    <div className="page">
      <div className="cards">
        <div className="card"><div className="lbl">Total Trades</div><div className="val blue">{stats.trades||0}</div></div>
        <div className="card"><div className="lbl">Wins</div><div className="val green">{stats.wins||0}</div></div>
        <div className="card"><div className="lbl">Losses</div><div className="val red">{stats.losses||0}</div></div>
        <div className="card"><div className="lbl">Breakeven</div><div className="val yellow">{stats.breakevens||0}</div></div>
        <div className="card" title="WIN / (WIN + LOSS) — breakeveny nie liczą się do mianownika"><div className="lbl">Win Rate W/(W+L)</div><div className="val">{stats.winRate||"0.0"}%</div></div>
        <div className="card"><div className="lbl">Avg Peak</div><div className="val">{stats.avgPeak||"0.00"} p</div></div>
        <div className="card"><div className="lbl">Avg Duration</div><div className="val">{stats.avgDuration||"0.0"} m</div></div>
        <div className="card"><div className="lbl">Checks</div><div className="val yellow">{stats.checksTotal||0}</div></div>
      </div>

      <div className="g2">
        <div className="panel">
          <div className="ph">Block Breakdown — Today</div>
          <div style={{padding:"16px"}}>
            {blockTypes.map(({key,label})=>{
              const n = (today.blockCounts||{})[key]||0;
              const pct = totalBlocks>0 ? Math.round(n/totalBlocks*100) : 0;
              return (
                <div className="bar-row" key={key}>
                  <div className="blbl">{label}</div>
                  <div className="btrack"><div className="bfill" style={{width:pct+"%"}}/></div>
                  <div className="bval">{n} <span className="pz">({pct}%)</span></div>
                </div>
              );
            })}
            {totalBlocks===0&&<div className="empty">No blocks today</div>}
          </div>
        </div>

        <div className="panel">
          <div className="ph">Performance per Symbol</div>
          <div className="pb">
            {symbols.length===0 ? <div className="empty">No data</div> : (
              <table><thead><tr>
                <th>Symbol</th><th>Trades</th><th>Win%</th><th>Avg P</th><th>Avg Peak</th>
              </tr></thead><tbody>
                {symbols.map(s=>(
                  <tr key={s.symbol}>
                    <td><b>{s.symbol}</b></td>
                    <td>{s.trades}</td>
                    <td><span className={parseFloat(s.winRate)>=50?"pp":"pn"}>{s.winRate}%</span></td>
                    <td>{fmtPips(s.avgProfit)}</td>
                    <td>{fmtPips(s.avgPeak)}</td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>

      {/* ── Confirmation Lag Analysis ── */}
      <div className="panel">
        <div className="ph">
          Confirmation Lag — które warunki blokują wejście najczęściej
          <span style={{fontWeight:400,color:"#484f58"}}>checks: {(confirmLag.totalChecks||0)} · post-entry failures: {(confirmLag.postEntryFailures||0)}</span>
        </div>
        {(confirmLag.conditions||[]).length===0
          ? <div className="empty" style={{padding:20}}>Brak danych — za mało buy/sell check events</div>
          : (
            <table>
              <thead><tr>
                <th>Warunek</th>
                <th style={{textAlign:"right"}}>TRUE</th>
                <th style={{textAlign:"right"}}>FALSE</th>
                <th style={{textAlign:"right"}}>TRUE %</th>
                <th style={{textAlign:"right"}}>Ocena</th>
              </tr></thead>
              <tbody>
                {(confirmLag.conditions||[]).map(c=>{
                  const rate = c.trueRate ?? 0;
                  const col  = rate < 30 ? "#f85149" : rate < 60 ? "#d29922" : "#3fb950";
                  const tag  = rate < 30 ? "⚠ BLOCKER" : rate < 60 ? "~ partial" : "✓ ok";
                  return (
                    <tr key={c.condition}>
                      <td style={{fontWeight:600}}>{c.condition}</td>
                      <td style={{textAlign:"right",color:"#3fb950"}}>{c.trueN}</td>
                      <td style={{textAlign:"right",color:"#f85149"}}>{c.falseN}</td>
                      <td style={{textAlign:"right"}}>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:8}}>
                          <div style={{width:80,background:"#21262d",borderRadius:3,height:8,overflow:"hidden"}}>
                            <div style={{width:rate+"%",height:"100%",background:col,borderRadius:3}}/>
                          </div>
                          <span style={{color:col,fontWeight:700,minWidth:40}}>{rate}%</span>
                        </div>
                      </td>
                      <td style={{textAlign:"right",color:col,fontSize:11}}>{tag}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )
        }
      </div>
      <ExitManagerSection data={exitMgr}/>
    </div>
  );
}

// ── EXIT MANAGER section ────────────────────────────────────────────────────
function ExitManagerSection({ data }){
  if(!data) return <div className="panel"><div className="ph">EXIT ANALYSIS</div><div className="empty" style={{padding:16}}>Loading…</div></div>;
  const { avg_mfe_capture_pct, avg_profit_given_back, avg_retained_profit, exit_efficiency,
          avg_mfe30, avg_mfe60, avg_mfe120, sampleMfe30=0, totalTrades=0,
          reasonDistribution=[],
          floor_triggered_count=0, avg_saved_pips=null, avg_protected_profit=null } = data;
  const effCol = v => v==null?"#484f58":v>=60?"#3fb950":v>=30?"#d29922":"#f85149";
  return (
    <div className="panel">
      <div className="ph">EXIT ANALYSIS
        <span style={{fontWeight:400,color:"#484f58"}}>MFE capture + exit reason distribution — {totalTrades} trade{totalTrades!==1?"s":""}</span>
      </div>
      <div className="cards" style={{margin:"12px 0"}}>
        <div className="card"><div className="lbl">Avg Retained Profit</div><div className="val" style={{color:effCol(avg_retained_profit)}}>{avg_retained_profit!=null?avg_retained_profit+"%":"—"}</div></div>
        <div className="card"><div className="lbl">Avg MFE Capture %</div><div className="val" style={{color:effCol(avg_mfe_capture_pct)}}>{avg_mfe_capture_pct!=null?avg_mfe_capture_pct+"%":"—"}</div></div>
        <div className="card"><div className="lbl">Exit Efficiency</div><div className="val" style={{color:effCol(exit_efficiency)}}>{exit_efficiency!=null?exit_efficiency+"%":"—"}</div></div>
        <div className="card"><div className="lbl">Avg Given Back</div><div className="val red">{avg_profit_given_back!=null?avg_profit_given_back+"p":"—"}</div></div>
        <div className="card"><div className="lbl">Avg MFE @ 30s</div><div className="val blue">{avg_mfe30!=null?avg_mfe30+"p":"—"}</div></div>
        <div className="card"><div className="lbl">Avg MFE @ 60s</div><div className="val blue">{avg_mfe60!=null?avg_mfe60+"p":"—"}</div></div>
        <div className="card"><div className="lbl">Avg MFE @ 120s</div><div className="val blue">{avg_mfe120!=null?avg_mfe120+"p":"—"}</div></div>
      </div>
      {(floor_triggered_count>0||avg_saved_pips!=null||avg_protected_profit!=null) && (
        <div style={{padding:"0 16px 4px"}}>
          <div style={{fontWeight:600,fontSize:11,color:"#3fb950",textTransform:"uppercase",letterSpacing:".8px",marginBottom:8}}>
            ▼ EXIT FLOOR PROTECTION (v39.4) — MFE ≥ 2p → floor = MAX(0, MFE × 0.35)
          </div>
          <div className="cards">
            <div className="card">
              <div className="lbl">Protected Exits</div>
              <div className="val" style={{color:floor_triggered_count>0?"#3fb950":"#484f58"}}>{floor_triggered_count}</div>
            </div>
            <div className="card">
              <div className="lbl">Avg Saved Pips</div>
              <div className="val" style={{color:avg_saved_pips!=null?"#3fb950":"#484f58"}}>{avg_saved_pips!=null?avg_saved_pips+"p":"—"}</div>
            </div>
            <div className="card">
              <div className="lbl">Avg Protected Profit</div>
              <div className="val blue">{avg_protected_profit!=null?avg_protected_profit+"p":"—"}</div>
            </div>
          </div>
        </div>
      )}
      {totalTrades>0 && sampleMfe30===0 && (
        <div style={{padding:"0 16px 4px",fontSize:11,color:"#484f58"}}>
          ℹ MFE time snapshots (30s/60s/120s) accumulate from new trades only.
        </div>
      )}
      {reasonDistribution.length>0 && (
        <div style={{padding:"0 0 16px"}}>
          <div style={{fontWeight:600,fontSize:12,color:"#79c0ff",padding:"10px 16px 6px",textTransform:"uppercase",letterSpacing:".8px"}}>
            Exit Reason Distribution
          </div>
          <table>
            <thead><tr>
              <th>Exit Reason</th>
              <th style={{textAlign:"right"}}>Count</th>
              <th style={{textAlign:"right"}}>%</th>
            </tr></thead>

// ── Chart helpers ──────────────────────────────────────────────────────────
const CHART_OPTS_BASE = {
  responsive:true,
  maintainAspectRatio:true,
  plugins:{ legend:{ labels:{ color:"#8b949e", font:{size:11} } } },
  scales:{
    x:{ ticks:{ color:"#8b949e", font:{size:10} }, grid:{ color:"#21262d" } },
    y:{ ticks:{ color:"#8b949e", font:{size:10} }, grid:{ color:"#21262d" } },
  },
};

function EquityChart({ trades }){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current||!trades.length) return;
    if(chartRef.current) chartRef.current.destroy();
    let cum=0;
    const points = trades
      .filter(t=>t.close)
      .sort((a,b)=>a.open.timestamp>b.open.timestamp?1:-1)
      .map(t=>{ cum+=t.close.profitPips||0; return {x:hm(t.close.timestamp||t.open.timestamp),y:parseFloat(cum.toFixed(2))}; });
    chartRef.current = new Chart(ref.current, {
      type:"line",
      data:{ labels:points.map(p=>p.x), datasets:[{
        label:"Cumulative pips", data:points.map(p=>p.y),
        borderColor:"#58a6ff", backgroundColor:"rgba(88,166,255,.08)",
        tension:.3, pointRadius:2, fill:true,
      }]},
      options:{ ...CHART_OPTS_BASE, plugins:{...CHART_OPTS_BASE.plugins, legend:{display:false}} },
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[trades]);
  if(!trades.length) return <div className="empty">No closed trades yet</div>;
  return <canvas ref={ref}/>;
}

function BarChart({ labels, values, color="#58a6ff", label="Value", extra={} }){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current||!labels.length) return;
    if(chartRef.current) chartRef.current.destroy();
    const baseOpts = { ...CHART_OPTS_BASE, plugins:{...CHART_OPTS_BASE.plugins, legend:{display:false}} };
    function deepMerge(a, b){
      const out = {...a};
      for(const k of Object.keys(b||{})){
        if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")
          out[k] = deepMerge(a[k], b[k]);
        else out[k] = b[k];
      }
      return out;
    }
    chartRef.current = new Chart(ref.current, {
      type:"bar",
      data:{ labels, datasets:[{ label, data:values, backgroundColor:color, borderRadius:4 }]},
      options: deepMerge(baseOpts, extra),
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[labels,values,color,label,extra]);
  if(!labels.length) return <div className="empty">No data</div>;
  return <canvas ref={ref}/>;
}

// ── DECYZJE tab ────────────────────────────────────────────────────────────
function DecyzjeTab({ events }){
  const checks = events.filter(e=>e.type==="buy_check"||e.type==="sell_check").slice(0,50);
  if(!checks.length) return <div className="page"><div className="empty" style={{marginTop:40}}>No decision events yet</div></div>;

  return (
    <div className="page">
      {checks.map((e,i)=>{
        const d = e.data;
        const allConds = {
          trend:d.trend,candle:d.candle,ema:d.ema,strength:d.strength,
          m1trend:d.m1trend,m1candle:d.m1candle,m1prev:d.m1prev,m1close:d.m1close,
        };
        const passCount = Object.values(allConds).filter(Boolean).length;
        const allPass   = passCount===8;
        return (
          <div className="dcard" key={i}>
            <div className="dhead">
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span className="sym">{e.symbol}</span>
                <span className={`tag ${e.type==="buy_check"?"buy":"sell"}`}>{e.type==="buy_check"?"BUY":"SELL"}</span>
                {d.session && <span className="tag-session">{d.session}</span>}
                {allPass && <span className="tag ok">✓ SIGNAL</span>}
              </div>
              <span className="time">{hms(e.ts)} UTC · spread {d.spread?.toFixed(2)||"?"} p</span>
            </div>
            <div style={{display:"flex",gap:16,marginBottom:8,flexWrap:"wrap"}}>
              <span style={{fontSize:11,color:"#8b949e"}}>EMA dist: <b style={{color:"#e6edf3"}}>{d.emaDistance?.toFixed(1)||"?"}p</b></span>
              <span style={{fontSize:11,color:"#8b949e"}}>Candle str: <b style={{color:"#e6edf3"}}>{d.candleStrength?.toFixed(2)||"?"}</b></span>
              <span style={{fontSize:11,color:"#8b949e"}}>Entry dist: <b style={{color:"#e6edf3"}}>{d.entryDistance?.toFixed(2)||"?"}p</b></span>
              <span style={{fontSize:11,color:"#8b949e"}}>Pass: <b style={{color: allPass?"#3fb950":passCount>=6?"#d29922":"#f85149"}}>{passCount}/8</b></span>
              {d.volatilityBucket && <span style={{fontSize:11,color:"#8b949e"}}>Vol: <b style={{color:"#e6edf3"}}>{d.volatilityBucket}</b></span>}
              {d.trendBucket      && <span style={{fontSize:11,color:"#8b949e"}}>Trend: <b style={{color:"#e6edf3"}}>{d.trendBucket}</b></span>}
            </div>
            <div className="conditions">
              {Object.entries(allConds).map(([k,v])=>(
                <div className="cond" key={k}>
                  <span className="cname">{k}</span>
                  <span className={`cv ${v?"t":"f"}`}>{v?"✓":"✗"}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── INSIGHTS tab ───────────────────────────────────────────────────────────
function InsightsTab({ insights, blockedOutcomes, drift, m1exp, m5exp, m1closeExp, gateExp, analytics, spreadEdge, cooldownAna }){
  if(!insights) return <div className="page"><div className="loading">Loading insights…</div></div>;

  const { summary={}, bestSession, worstSession, bestSymbol, worstSymbol,
          mostExpensiveFilter, bestFingerprint, worstFingerprint,
          highestMFERegime, recentDriftAlerts=[], sessionStats=[], volStats=[],
          blockBreakdown=[] } = insights;

  function InsightCard({ title, value, sub, kind="info" }){
    return (
      <div className={`icard ${kind}`}>
        <div className="ititle">{title}</div>
        <div className="ivalue">{value||"—"}</div>
        {sub && <div className="isub">{sub}</div>}
      </div>
    );
  }

  const bestSessionStr  = bestSession  ? `${bestSession.session} — ${bestSession.winRate}% WR (${bestSession.trades}t)` : null;
  const worstSessionStr = worstSession ? `${worstSession.session} — ${worstSession.winRate}% WR (${worstSession.trades}t)` : null;
  const bestSymStr      = bestSymbol   ? `${bestSymbol.symbol} — ${bestSymbol.winRate}% WR` : null;
  const worstSymStr     = worstSymbol  ? `${worstSymbol.symbol} — ${worstSymbol.winRate}% WR` : null;
  const filterStr       = mostExpensiveFilter ? `${mostExpensiveFilter.type.replace("_"," ")} (${mostExpensiveFilter.count})` : null;
  const bestFpStr       = bestFingerprint  ? `${bestFingerprint.fp} — ${bestFingerprint.winRate}% WR` : null;
  const worstFpStr      = worstFingerprint ? `${worstFingerprint.fp} — ${worstFingerprint.winRate}% WR` : null;
  const mfeRegStr       = highestMFERegime ? `${highestMFERegime.bucket} — avg MFE ${highestMFERegime.avgMFE}p` : null;

  const exitEffColor = summary.avgExitEfficiency == null ? "info" : summary.avgExitEfficiency >= 60 ? "good" : summary.avgExitEfficiency >= 35 ? "warn" : "bad";
  const entryEffColor = summary.avgEntryEfficiency == null ? "info" : summary.avgEntryEfficiency >= 2 ? "good" : summary.avgEntryEfficiency >= 0 ? "warn" : "bad";

  return (
    <div className="page">
      {/* ── Summary cards ── */}
      <div className="sec-label">Decision Intelligence Summary</div>
      <div className="cards" style={{gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))"}}>
        <div className="card"><div className="lbl">Total Trades</div><div className="val blue">{summary.totalTrades||0}</div></div>
        <div className="card"><div className="lbl">Total Blocks</div><div className="val yellow">{summary.totalBlocks||0}</div></div>
        <div className="card"><div className="lbl">Avg Exit Eff</div><div className={`val ${exitEffColor==="good"?"green":exitEffColor==="bad"?"red":"yellow"}`}>{summary.avgExitEfficiency!=null?summary.avgExitEfficiency.toFixed(1)+"%":"—"}</div></div>
        <div className="card"><div className="lbl">Avg Entry Eff</div><div className={`val ${entryEffColor==="good"?"green":entryEffColor==="bad"?"red":"yellow"}`}>{summary.avgEntryEfficiency!=null?summary.avgEntryEfficiency.toFixed(2)+"p":"—"}</div></div>
        <div className="card"><div className="lbl">Post-Entry Fails</div><div className="val red">{summary.postEntryFailures||0}</div></div>
        <div className="card"><div className="lbl">Drift Alerts</div><div className={`val ${(summary.driftAlertCount||0)>0?"yellow":""}`}>{summary.driftAlertCount||0}</div></div>
      </div>

      {/* ── Key insights grid ── */}
      <div className="sec-label" style={{marginTop:8}}>Key Insights</div>
      <div className="g4">
        <InsightCard title="Best Session"          value={bestSession?.session}       sub={bestSession  ? `${bestSession.winRate}% WR · ${bestSession.trades} trades` : null}  kind="good"/>
        <InsightCard title="Worst Session"         value={worstSession?.session}      sub={worstSession ? `${worstSession.winRate}% WR · ${worstSession.trades} trades` : null} kind="bad"/>
        <InsightCard title="Best Symbol"           value={bestSymbol?.symbol}         sub={bestSymStr}  kind="good"/>
        <InsightCard title="Worst Symbol"          value={worstSymbol?.symbol}        sub={worstSymStr} kind="bad"/>
        <InsightCard title="Most Blocked Filter"   value={mostExpensiveFilter?.type?.replace(/_block/,"")||"—"} sub={filterStr} kind="warn"/>
        <InsightCard title="Best Fingerprint"      value={bestFingerprint?.fp}        sub={bestFpStr}   kind="good"/>
        <InsightCard title="Worst Fingerprint"     value={worstFingerprint?.fp}       sub={worstFpStr}  kind="bad"/>
        <InsightCard title="Highest MFE Regime"    value={highestMFERegime?.bucket}   sub={mfeRegStr}   kind="info"/>
      </div>

      {/* ── Session performance table ── */}
      <div className="g2">
        <div className="panel">
          <div className="ph">Session Performance</div>
          <div className="pb">
            {sessionStats.length===0 ? <div className="empty">No session data — trades need session field</div> : (
              <table><thead><tr>
                <th>Session</th><th>Trades</th><th>Win%</th><th>Avg P</th><th>Avg MFE</th><th>Exit Eff</th>
              </tr></thead><tbody>
                {sessionStats.sort((a,b)=>b.winRate-a.winRate).map((s,i)=>(
                  <tr key={i}>
                    <td><span className="tag-session">{s.session}</span></td>
                    <td>{s.trades}</td>
                    <td><span className={s.winRate>=50?"pp":"pn"}>{s.winRate}%</span></td>
                    <td>{fmtPips(s.avgPips)}</td>
                    <td>{s.avgMFE!=null?s.avgMFE.toFixed(2)+"p":"—"}</td>
                    <td>{s.avgExitEff!=null?s.avgExitEff.toFixed(1)+"%":"—"}</td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>

        <div className="panel">
          <div className="ph">Volatility Regime Performance</div>
          <div className="pb">
            {volStats.length===0 ? <div className="empty">No volatility data — needs trade_close with volatilityBucket</div> : (
              <table><thead><tr>
                <th>Regime</th><th>Trades</th><th>Win%</th><th>Avg MFE</th>
              </tr></thead><tbody>
                {volStats.sort((a,b)=>b.avgMFE-a.avgMFE).map((v,i)=>(
                  <tr key={i}>
                    <td><b>{v.bucket}</b></td>
                    <td>{v.trades}</td>
                    <td><span className={v.winRate>=50?"pp":"pn"}>{v.winRate}%</span></td>
                    <td>{v.avgMFE!=null?v.avgMFE.toFixed(2)+"p":"—"}</td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>

      {/* ── Filter effectiveness (blocked outcomes) ── */}
      <div className="panel">
        <div className="ph">
          Filter Effectiveness — Blocked Outcome Analysis (15-min window)
          <span style={{fontWeight:400,color:"#484f58"}}>total blocked outcomes logged: {blockedOutcomes?.total||0}</span>
        </div>
        {!(blockedOutcomes?.summary?.length) ? (
          <div className="empty" style={{padding:16}}>
            No blocked outcome data yet — collects after 15 min per blocked signal.
            <br/><span style={{fontSize:11,color:"#484f58"}}>Purpose: detect whether filters protect edge or destroy opportunity</span>
          </div>
        ) : (
          <table><thead><tr>
            <th>Filter</th><th>Total</th><th>Moved%</th><th>Stagnant%</th><th>Avg Move</th><th>Verdict</th>
          </tr></thead><tbody>
            {(blockedOutcomes.summary||[]).map((b,i)=>{
              const verdict = b.movedPct > 60 ? "⚠ Filter may cost edge" : b.movedPct < 30 ? "✓ Filter protecting" : "~ Neutral";
              const verdictColor = b.movedPct > 60 ? "#f85149" : b.movedPct < 30 ? "#3fb950" : "#d29922";
              return (
                <tr key={i}>
                  <td><b>{b.blockType.replace(/_block/,"").replace(/_/," ")}</b></td>
                  <td>{b.total}</td>
                  <td><span style={{color:"#f85149"}}>{b.movedPct}%</span></td>
                  <td><span style={{color:"#3fb950"}}>{(100-b.movedPct).toFixed(1)}%</span></td>
                  <td>{b.avgMovePips.toFixed(2)}p</td>
                  <td style={{color:verdictColor,fontSize:11,fontWeight:600}}>{verdict}</td>
                </tr>
              );
            })}
          </tbody></table>
        )}

        <div className="ph">All-Time Block Breakdown</div>
        <div style={{padding:"16px"}}>
          {blockBreakdown.length===0 ? <div className="empty">No blocks logged</div> : blockBreakdown.map((b,i)=>{

              <div className="bar-row" key={i}>
                <div className="blbl">{b.type.replace(/_block/,"").replace(/_/," ")}</div>

              </div>
            );
          })}
        </div>
      </div>

      {/* ── Strategy drift alerts ── */}
      <div className="panel">
        <div className="ph">
          Strategy Drift Monitor
          <span style={{fontWeight:400,color:"#484f58"}}>Rolling 20-trade window vs all-time. Alert fires at &gt;20% deviation.</span>
        </div>
        {drift?.alerts?.length===0 ? (
          <div className="empty" style={{padding:16}}>No drift alerts — strategy behavior is consistent with all-time baseline.</div>

          <div style={{padding:12}}>
            {(drift?.alerts||[]).map((a,i)=>(
              <div className="drift-alert" key={i}>
                <div className="da-title">⚠ DRIFT ALERT — {hms(a.ts)} UTC</div>

                  {" · "} Drift: <b style={{color:"#f85149"}}>{a.driftPct}%</b>
                  {" · "} Window avg pips: <b>{a.windowAvgPips}</b>
                  {" · "} All-time avg pips: <b>{a.allTimeAvgPips}</b>
                  <br/><span style={{fontSize:11,color:"#484f58"}}>Window size: {a.windowSize} trades · All-time: {a.allTimeTotal} trades</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ── Trade Quality Score (Module 2) ── */}
      {analytics?.quality?.length > 0 && (
        <div className="panel">
          <div className="ph">
            Trade Quality Analysis
            <span style={{fontWeight:400,color:"#484f58"}}>Win rate and pips segmented by passCount (# of 9 conditions met at entry). Requires ≥10 trades per bucket.</span>
          </div>
          <table>
            <thead><tr>
              <th>Score</th><th>Trades</th><th>W / L</th><th>Win Rate</th>
              <th>Avg Pips</th><th>Avg MFE</th><th>Avg MAE</th>
            </tr></thead>
            <tbody>
              {analytics.quality.map((q,i)=>{
                const wr = parseFloat(q.winRate);
                return (
                  <tr key={i}>
                    <td style={{fontFamily:"monospace",fontWeight:700,color: q.passCount>=9?"#3fb950":q.passCount>=8?"#d29922":"#e6edf3"}}>{q.score}</td>
                    <td>{q.trades}</td>
                    <td style={{fontSize:11,color:"#484f58"}}>{q.wins}W / {q.losses}L</td>
                    <td style={{color: wr>=60?"#3fb950":wr>=50?"#d29922":"#f85149",fontWeight:700}}>{q.winRate}%</td>
                    <td style={{color:parseFloat(q.avgPips)>0?"#3fb950":"#f85149"}}>{q.avgPips}p</td>
                    <td style={{color:"#79c0ff"}}>{q.avgMFE}p</td>
                    <td style={{color:"#f85149"}}>{q.avgMAE}p</td>

                );

          </table>

      {/* ── Post-Entry Failure — Per Condition (Module 1) ── */}

        <div className="panel">

            Post-Entry Failure Analysis

              {analytics.postEntry.total} post-entry failures logged (−1.5p within 3 min). Conditions that were FALSE at entry of those failures.

                ` ${analytics.postEntry.enriched}/${analytics.postEntry.total} enriched with conditionMap (post-deployment only).`}
            </span>
          </div>
          {analytics.postEntry.conditions.length === 0 ? (
            <div className="empty" style={{padding:16}}>No enriched post-entry failure data yet. Populates after bot redeploy.</div>
          ) : (
            <table>

// ── BLOCKED WINNERS tab ─────────────────────────────────────────────────────
function BlockedTab({ blocked, blockedV2, condPerf }){
  if(!blocked) return <div className="page"><div className="empty">Loading almost-trade forensics…</div></div>;

  const { conditionStats=[], passcoreStats=[], totalSignals=0, totalOutcomes=0, recentSignals=[] } = blocked;

  const condLabel = {
    m5trend:  "M5 Trend (EMA20>50)",
    m5close:  "M5 Close on EMA side",
    m5candle: "M5 Candle non-reversal",
    ema:      "EMA Distance > 1.8p",
    strength: "Candle Strength > MIN_STRENGTH (0.08)",
    m1trend:  "M1 Trend (EMA9>21)",
    m1candle: "M1 Current Candle dir.",
    m1prev:   "M1 Prev Candle",
    m1close:  "M1 Close on EMA9 side",
  };

  return (
    <div className="page">
      <div className="cards">
        <div className="card"><div className="lbl">Almost Trades</div><div className="val blue">{totalSignals}</div></div>
        <div className="card"><div className="lbl">15-min Resolved</div><div className="val">{totalOutcomes}</div></div>
        <div className="card"><div className="lbl">Conditions w/ Data</div><div className="val">{conditionStats.length}</div></div>
        <div className="card"><div className="lbl">Pending Check</div><div className="val yellow">{totalSignals - totalOutcomes < 0 ? 0 : totalSignals - totalOutcomes}</div></div>
      </div>

      <div className="panel">
        <div className="ph">
          BLOCKED WINNERS — Per-Condition Analysis
          <span style={{fontWeight:400,color:"#484f58"}}>
            Which failing condition blocks the most future winners? Sorted by +4p% (strongest missed move signal).
          </span>
        </div>
        {conditionStats.length===0
          ? <div className="empty" style={{padding:16}}>No outcomes resolved yet — 15-min timer still running for recent signals. Check back soon.</div>
          : (
            <table>
              <thead><tr>
                <th>Condition</th>
                <th>Blocked</th>
                <th>Correct Dir %</th>
                <th>+2p %</th>
                <th>+4p %</th>
                <th>+6p %</th>
                <th>Avg Move</th>
              </tr></thead>
              <tbody>
                {conditionStats.map((c,i)=>{
                  const p2 = parseFloat(c.pct2p);
                  const p4 = parseFloat(c.pct4p);
                  const p6 = parseFloat(c.pct6p);
                  const pcd = parseFloat(c.dirCorrectPct);
                  return (
                    <tr key={i}>
                      <td style={{fontFamily:"monospace",fontWeight:600,color:"#e6edf3"}}>{condLabel[c.condition]||c.condition}</td>
                      <td>{c.total}</td>
                      <td style={{color:pcd>=60?"#3fb950":pcd>=40?"#d29922":"#f85149",fontWeight:600}}>{c.dirCorrectPct}%</td>
                      <td style={{color:p2>=50?"#3fb950":"#8b949e"}}>{c.pct2p}%</td>
                      <td style={{color:p4>=40?"#d29922":"#8b949e",fontWeight:p4>=40?700:400}}>{c.pct4p}%</td>
                      <td style={{color:p6>=30?"#f85149":"#8b949e"}}>{c.pct6p}%</td>
                      <td style={{color:"#79c0ff"}}>{c.avgMove}p</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )
        }
      </div>

      <div className="panel">
        {/* ── Missed Opportunities by Pass Score (Module 3) ── */}
        {passcoreStats.length > 0 && (
          <div style={{marginBottom:16}}>
            <div style={{fontWeight:600,fontSize:13,color:"#79c0ff",padding:"10px 0 6px"}}>
              Missed Opportunities by Pass Score
              <span style={{fontWeight:400,fontSize:11,color:"#484f58",marginLeft:8}}>Blocked setups grouped by how many of 9 conditions they met.</span>
            </div>
            <table>
              <thead><tr>
                <th>Pass Score</th><th>Blocked</th><th>+2p %</th><th>+4p %</th><th>+6p %</th><th>Avg Move</th>
              </tr></thead>
              <tbody>
                {passcoreStats.map((p,i)=>(
                  <tr key={i}>
                    <td style={{fontFamily:"monospace",fontWeight:700,color:p.passCount>=8?"#d29922":p.passCount>=6?"#e6edf3":"#484f58"}}>{p.score}</td>
                    <td>{p.blocked}</td>
                    <td style={{color: parseFloat(p.pct2p)>=50?"#3fb950":"#e6edf3"}}>{p.pct2p}%</td>
                    <td style={{color: parseFloat(p.pct4p)>=30?"#d29922":"#e6edf3",fontWeight: parseFloat(p.pct4p)>=30?700:400}}>{p.pct4p}%</td>
                    <td style={{color:"#e6edf3"}}>{p.pct6p}%</td>
                    <td style={{color:"#79c0ff"}}>{p.avgMove}p</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <div className="ph">Recent Almost-Trade Signals <span style={{fontWeight:400,color:"#484f58"}}>passCount ≥ 4, trade NOT placed</span></div>
        <div className="pb">
          {recentSignals.length===0
            ? <div className="empty" style={{padding:16}}>No signals logged yet.</div>
            : (
              <table>
                <thead><tr>
                  <th>Time UTC</th><th>Symbol</th><th>Dir</th><th>Pass</th><th>Failed Conditions</th><th>Session</th>
                </tr></thead>
                <tbody>
                  {recentSignals.map((s,i)=>(
                    <tr key={i}>
                      <td style={{fontSize:11,color:"#484f58"}}>{s.ts?s.ts.slice(11,19):""}</td>
                      <td style={{fontWeight:600}}>{s.symbol}</td>
                      <td><span className={s.direction==="buy"?"tag buy":"tag sell"}>{(s.direction||"").toUpperCase()}</span></td>
                      <td><span style={{color:"#3fb950",fontWeight:700}}>{s.passCount}/9</span></td>
                      <td style={{fontSize:11,color:"#d29922"}}>{(s.failedConditions||[]).join(", ")}</td>
                      <td><span className="tag-session">{s.session||""}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )
          }
        </div>
      </div>
      <BlockedWinnersV2Panel data={blockedV2}/>
      <ConditionPerfPanel    data={condPerf}/>
    </div>
  );
}

// ── PIPELINE AUDIT tab ──────────────────────────────────────────────────────
function PipelineAuditTab({ pipeline }) {
  if (!pipeline) return <div className="page"><div className="empty" style={{marginTop:40}}>Loading pipeline audit…</div></div>;
  const { waterfall=[], findings=[], recentRejections=[], taxonomy={}, terminalBlocker, silentLeakage, checksTotal, tradeOpens, tradeCloses } = pipeline;
  const sevColor   = s => s==="CRITICAL"?"#f85149":s==="HIGH"?"#d29922":"#58a6ff";
  const classColor = c => c==="STRATEGY ISSUE"||c==="LOGIC BUG"?"#f85149":c==="TELEMETRY BUG"||c==="DEPLOYMENT BUG"?"#d29922":c==="SAFE"?"#3fb950":"#58a6ff";
  const maxSurv    = waterfall[0]?.survivors || 1;
  return (
    <div className="page">
      <div className="cards">
        <div className="card"><div className="lbl">Signals Detected</div><div className="val blue">{waterfall[0]?.survivors||0}</div></div>
        <div className="card"><div className="lbl">Reached Gate</div><div className="val yellow">{checksTotal||0}</div></div>
        <div className="card"><div className="lbl">Gate Pass → Trades</div><div className="val green">{tradeOpens||0}</div></div>
        <div className="card"><div className="lbl">Bot-Closed</div><div className="val">{tradeCloses||0}</div></div>
        <div className="card"><div className="lbl">Silent Leakage</div><div className={`val ${(silentLeakage||0)>0?"red":"green"}`}>{silentLeakage||0}</div></div>
        <div className="card" style={{gridColumn:"span 2"}}><div className="lbl">Terminal Blocker</div><div style={{fontSize:13,fontWeight:700,color:"#f85149",marginTop:4,wordBreak:"break-all"}}>{terminalBlocker||"none detected"}</div></div>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="ph">Audit Findings</div>
        <div style={{padding:"10px 15px",display:"flex",flexDirection:"column",gap:8}}>
          {findings.map((f,i)=>(
            <div key={i} style={{background:"#0d1117",border:"1px solid #30363d",borderRadius:6,padding:"8px 12px"}}>
              <div style={{display:"flex",gap:6,marginBottom:4,alignItems:"center",flexWrap:"wrap"}}>
                <span style={{fontSize:10,fontWeight:700,padding:"1px 7px",borderRadius:4,background:"#161b22",color:sevColor(f.severity)}}>{f.severity}</span>
                <span style={{fontSize:10,fontWeight:700,padding:"1px 7px",borderRadius:4,background:"#161b22",color:classColor(f.classification)}}>{f.classification}</span>
              </div>
              <div style={{fontSize:12,color:"#c9d1d9",lineHeight:"1.5"}}>{f.finding}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="ph">Rejection Waterfall <span style={{fontWeight:400,color:"#484f58"}}>signals detected → trades closed</span></div>
        <div className="pb" style={{maxHeight:440}}>
          <table><thead><tr><th>#</th><th>Stage</th><th>Blocks</th><th>Survivors</th><th>Remain %</th><th>Source</th></tr></thead>
          <tbody>{waterfall.map((w,i)=>{
            const pct = maxSurv>0 ? Math.round(w.survivors/maxSurv*100) : 0;
            const barColor = pct>50?"#3fb950":pct>20?"#d29922":"#f85149";
            return (
              <tr key={i}>
                <td style={{color:"#484f58"}}>{i+1}</td>
                <td style={{fontWeight:500}}>{w.stage}</td>
                <td style={{color:w.blocks>0?"#f85149":"#484f58"}}>{w.blocks!=null?w.blocks:"—"}</td>

                <td><div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{width:60,height:6,background:"#21262d",borderRadius:3,overflow:"hidden"}}>
                    <div style={{width:`${pct}%`,height:"100%",background:barColor,borderRadius:3}}/>
                  </div>
                  <span style={{color:"#8b949e",fontSize:11}}>{pct}%</span>
                </div></td>
                <td style={{color:"#484f58",fontSize:11}}>{w.note}</td>
              </tr>
            );
          })}</tbody></table>
        </div>
      </div>

      <div className="panel" style={{marginBottom:16}}>
        <div className="ph">Recent 20 Rejected Opportunities <span style={{fontWeight:400,color:"#484f58"}}>signals that survived spread+exhaustion+spreadEdge but didn't trade</span></div>
        <div className="pb" style={{maxHeight:380}}>
          {recentRejections.length===0
            ? <div className="empty" style={{margin:"20px auto"}}>No rejections yet — accumulates as bot runs</div>
            : <table><thead><tr><th>UTC</th><th>Symbol</th><th>Reason</th><th>Score</th><th>Spread</th><th>EntryDist</th><th>Session</th><th>Failed Conditions</th></tr></thead>
              <tbody>{recentRejections.map((r,i)=>(
                <tr key={i}>
                  <td className="pz">{r.ts?r.ts.slice(11,19):"—"}</td>
                  <td style={{fontWeight:600}}>{r.symbol||"—"}</td>
                  <td><span className="tag fail">{r.reason||"—"}</span></td>
                  <td style={{color:r.passScore>=7?"#3fb950":r.passScore>=5?"#d29922":"#f85149"}}>{r.passScore!=null?r.passScore+"/9":"—"}</td>
                  <td>{r.spread!=null?r.spread.toFixed(2)+"p":"—"}</td>
                  <td style={{color:(r.entryDistance||0)>1.5?"#f85149":"#3fb950"}}>{r.entryDistance!=null?r.entryDistance.toFixed(2)+"p":"—"}</td>
                  <td><span className="tag-session">{r.session||"—"}</span></td>
                  <td style={{color:"#8b949e",fontSize:11}}>{r.failedConditions||"—"}</td>
                </tr>
              ))}</tbody></table>}
        </div>
      </div>

      <div className="panel">
        <div className="ph">Event Taxonomy Verification <span style={{fontWeight:400,color:"#484f58"}}>required event types → actual DB events</span></div>
        <div className="pb" style={{maxHeight:320}}>
          <table><thead><tr><th>Required Type</th><th>Actual DB Event</th><th>Count</th><th>Status</th><th>Notes</th></tr></thead>
          <tbody>{Object.entries(taxonomy).map(([req,info],i)=>(
            <tr key={i}>
              <td style={{fontWeight:600,fontFamily:"monospace",fontSize:11}}>{req}</td>
              <td style={{fontFamily:"monospace",color:"#58a6ff",fontSize:11}}>{info.event}</td>
              <td style={{fontWeight:700,color:info.count>0?"#3fb950":"#484f58"}}>{info.count}</td>
              <td><span className={`tag ${info.event==="N/A"?"be":info.count>0?"ok":"fail"}`}>{info.event==="N/A"?"N/A":info.count>0?"OK":"EMPTY"}</span></td>
              <td style={{color:"#484f58",fontSize:11}}>{info.note}</td>
            </tr>
          ))}</tbody></table>
        </div>
      </div>
    </div>
  );
}

// ── ROOT APP ───────────────────────────────────────────────────────────────
function App(){
  const [tab,    setTab]    = useState("LIVE");
  const [live,   setLive]   = useState({ botStatus:"starting", openTrades:[], recentBlocks:[], dailyTrades:0 });
  const [today,  setToday]  = useState({});
  const [stats,  setStats]  = useState({});
  const [symbols,setSymbols]= useState([]);
  const [trades, setTrades] = useState([]);
  const [winrate,setWinrate]= useState({});
  const [fps,    setFps]    = useState(null);
  const [exc,    setExc]    = useState(null);
  const [confirmLag, setConfirmLag] = useState({});
  const [insights,   setInsights]   = useState(null);
  const [blockedOut, setBlockedOut] = useState(null);
  const [blocked,    setBlocked]    = useState(null);
  const [blockedV2,  setBlockedV2]  = useState(null);
  const [condPerf,   setCondPerf]   = useState(null);
  const [exitMgr,    setExitMgr]    = useState(null);
  const [pipeline,   setPipeline]   = useState(null);
  const [m1exp,      setM1exp]      = useState(null);
  const [m5exp,      setM5exp]      = useState(null);
  const [m1closeExp, setM1closeExp] = useState(null);
  const [gateExp,    setGateExp]    = useState(null);
  const [analytics,  setAnalytics]  = useState(null);
  const [drift,      setDrift]      = useState(null);
  const [spreadEdge, setSpreadEdge] = useState(null);
  const [cooldownAna,setCooldownAna]= useState(null);
  const [events, setEvents] = useState([]);
  const [logLines,setLogLines]=useState([]);
  const [ts,     setTs]     = useState(null);

  // Fetch all data
  async function refresh(){
    const [todayData, statsData, symsData, tradesData, wrData, lagData] = await Promise.all([
      api("/api/today"), api("/api/stats"), api("/api/symbols"),
      api("/api/trades"), api("/api/winrate-analysis"), api("/api/confirmation-lag"),
    ]);
    setToday(todayData);
    setStats(statsData);
    setSymbols(symsData);
    setTrades(tradesData);
    setWinrate(wrData);
    setConfirmLag(lagData);
    setTs(new Date().toISOString());
  }

  async function refreshInsights(){
    const [ins, bo, dr, m1e, m5e, m1ce, ge, pef, qual, se, ca] = await Promise.all([
      api("/api/insights"), api("/api/blocked-outcomes"), api("/api/drift"),
      api("/api/m1trend-experiment"),
      api("/api/m5trend-experiment"),
      api("/api/m1close-experiment"),
      api("/api/gate-experiment"),
      api("/api/post-entry-failures"),
      api("/api/trade-quality"),
      api("/api/spread-edge-analysis"),
      api("/api/cooldown-analysis"),
    ]);
    setInsights(ins);
    setBlockedOut(bo);
    setDrift(dr);
    setM1exp(m1e);
    setM5exp(m5e);
    setM1closeExp(m1ce);
    setGateExp(ge);
    setAnalytics({ postEntry: pef, quality: qual });
    setSpreadEdge(se);
    setCooldownAna(ca);
  }

  async function refreshFps(){ const d=await api("/api/fingerprints"); setFps(d); }
  async function refreshExc(){ const d=await api("/api/excursion");    setExc(d); }
  async function refreshEvents(){ const d=await api("/api/events?limit=100"); setEvents(d); }
  async function refreshExitMgr(){ const d=await api("/api/exit-manager"); setExitMgr(d); }
  async function refreshBlocked(){
    const [d, v2, cp] = await Promise.all([
      api("/api/almost-trades"),
      api("/api/blocked-winners-v2"),
      api("/api/condition-performance"),
    ]);
    setBlocked(d); setBlockedV2(v2); setCondPerf(cp);
  }
  async function refreshPipeline(){ const d=await api("/api/pipeline-audit"); setPipeline(d); }

  useEffect(()=>{
    refresh();
    const id=setInterval(refresh,30000);
    return ()=>clearInterval(id);
  },[]);

  // Load tab-specific data on demand
  useEffect(()=>{
    if(tab==="WZORCE")   refreshFps();
    if(tab==="EXCURSION")refreshExc();
    if(tab==="DECYZJE")  refreshEvents();
    if(tab==="INSIGHTS") refreshInsights();
    if(tab==="ANALIZA")  refreshExitMgr();
    if(tab==="BLOCKED")  refreshBlocked();
    if(tab==="PIPELINE") refreshPipeline();
  },[tab]);

  // SSE for live updates
  useEffect(()=>{
    const es = new EventSource("/api/events/stream");
    es.onmessage = (e)=>{
      const msg = JSON.parse(e.data);
      if(msg.source==="live"){
        if(msg.type==="init"){
          setLive(prev=>({...prev,...msg.live}));
        } else if(msg.type==="pips"){
          setLive(prev=>{
            const trades={...prev.openTrades.reduce((a,t)=>({...a,[t.symbol]:t}),{})};
            if(trades[msg.symbol]) trades[msg.symbol]={...trades[msg.symbol],pips:msg.pips};
            return {...prev,openTrades:Object.values(trades)};
          });
        } else if(msg.type==="trade_opened"){
          setLive(prev=>({...prev,openTrades:[...prev.openTrades.filter(t=>t.symbol!==msg.symbol),{symbol:msg.symbol,side:msg.side,pips:0,peak:0,breakEven:false,entryTime:Date.now()}]}));
        } else if(msg.type==="trade_closed"){
          setLive(prev=>({...prev,openTrades:prev.openTrades.filter(t=>t.symbol!==msg.symbol)}));
          refresh();
        } else if(msg.type==="daily_count"){
          setLive(prev=>({...prev,dailyTrades:msg.value}));
        } else if(msg.type==="block"){
          setLogLines(prev=>[{t:new Date().toISOString(),line:msg.line},...prev].slice(0,200));
          setLive(prev=>({...prev,recentBlocks:[{t:new Date().toISOString(),line:msg.line},...(prev.recentBlocks||[])].slice(0,20)}));
        } else if(msg.type==="bot_status"){
          setLive(prev=>({...prev,botStatus:msg.status}));
        }
      }
      if(msg.source==="db"){
        const line = msg.type+" "+( msg.symbol||"" );
        setLogLines(prev=>[{t:new Date().toISOString(),line},...prev].slice(0,200));
        setTs(new Date().toISOString());
      }
    };
    return ()=>es.close();
  },[]);

  const liveWithArray = {...live, openTrades: Array.isArray(live.openTrades)?live.openTrades:Object.values(live.openTrades||{})};

  return (
    <>
      <Header botStatus={liveWithArray.botStatus} ts={ts}/>
      <Tabs active={tab} set={setTab}/>
      {tab==="LIVE"      && <LiveTab     live={liveWithArray} today={today} logLines={logLines}/>}
      {tab==="ANALIZA"   && <AnalyzaTab  stats={stats} today={today} symbols={symbols} confirmLag={confirmLag} exitMgr={exitMgr}/>}
      {tab==="WYKRESY"   && <WykreśyTab  symbols={symbols} trades={trades} winrate={winrate}/>}
      {tab==="DECYZJE"   && <DecyzjeTab  events={events}/>}
      {tab==="WZORCE"    && <WzorceTab   fps={fps}/>}
      {tab==="EXCURSION" && <ExcursionTab exc={exc}/>}
      {tab==="INSIGHTS"  && <InsightsTab insights={insights} blockedOutcomes={blockedOut} drift={drift} m1exp={m1exp} m5exp={m5exp} m1closeExp={m1closeExp} gateExp={gateExp} analytics={analytics} spreadEdge={spreadEdge} cooldownAna={cooldownAna}/>}
      {tab==="PIPELINE"  && <PipelineAuditTab pipeline={pipeline}/>}
      {tab==="BLOCKED"   && <BlockedTab  blocked={blocked} blockedV2={blockedV2} condPerf={condPerf}/>}
      {tab==="EXPORT"    && <ExportTab/>}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
