<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOREX ENGINE PRO — Telemetry</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
a{color:#58a6ff;text-decoration:none}

/* header */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hdr h1{font-size:15px;font-weight:600;color:#58a6ff;letter-spacing:.3px}
.hdr .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#3fb950}
.dot.stopped{background:#f85149}
.dot.starting{background:#d29922;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ts{font-size:11px;color:#484f58}

/* tabs */
.tabs{display:flex;gap:2px;background:#161b22;border-bottom:1px solid #30363d;padding:0 24px;overflow-x:auto;flex-shrink:0}
.tab{padding:10px 18px;cursor:pointer;font-size:13px;font-weight:500;color:#8b949e;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:#e6edf3}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}

/* layout */
.page{padding:20px 24px;max-width:1400px;margin:0 auto}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-bottom:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:13px 15px}
.card .lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.card .val{font-size:24px;font-weight:700}
.val.blue{color:#58a6ff}.val.green{color:#3fb950}.val.red{color:#f85149}.val.yellow{color:#d29922}

/* insight card */
.icard{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.icard .ititle{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.8px}
.icard .ivalue{font-size:18px;font-weight:700;color:#e6edf3}
.icard .isub{font-size:11px;color:#484f58}
.icard.good .ivalue{color:#3fb950}
.icard.warn .ivalue{color:#d29922}
.icard.bad  .ivalue{color:#f85149}
.icard.info .ivalue{color:#58a6ff}

/* grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* panel */
.panel{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;margin-bottom:16px}
.ph{padding:9px 15px;border-bottom:1px solid #30363d;font-size:11px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.pb{overflow-y:auto;max-height:320px}
.pb.short{max-height:220px}

/* table */
table{width:100%;border-collapse:collapse}
th{background:#0d1117;color:#8b949e;font-size:10px;font-weight:600;text-transform:uppercase;padding:7px 13px;text-align:left;position:sticky;top:0;z-index:1}
td{padding:7px 13px;border-bottom:1px solid #21262d;font-size:12px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1c2128}

/* tags / badges */
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;line-height:18px}
.buy{background:#1a3a26;color:#3fb950}.sell{background:#3a1a1a;color:#f85149}
.be{background:#1a2e3a;color:#58a6ff}
.ok{background:#1a3a26;color:#3fb950}.fail{background:#3a1a1a;color:#f85149}
.accepted{background:#1a3a26;color:#3fb950}.rejected{background:#3a2a00;color:#d29922}
.tag-session{background:#1a2540;color:#79c0ff;font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600}

/* pips colors */
.pp{color:#3fb950;font-weight:600}.pn{color:#f85149;font-weight:600}.pz{color:#8b949e}

/* empty state */
.empty{color:#484f58;padding:18px;text-align:center;font-size:12px}

/* decision card */
.dcard{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:13px 15px;margin-bottom:10px}
.dcard .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dcard .sym{font-weight:700;font-size:14px;color:#e6edf3}
.dcard .time{font-size:10px;color:#484f58}
.dcard .conditions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px;margin-top:8px}
.cond{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:#161b22;border-radius:4px;font-size:11px}
.cond .cname{color:#8b949e}
.cond .cv.t{color:#3fb950}.cond .cv.f{color:#f85149}

/* export btn */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#e6edf3;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none}
.btn:hover{background:#30363d}
.btn.primary{background:#1f4a2e;border-color:#3fb950;color:#3fb950}
.btn.primary:hover{background:#2a6040}

/* chart container */
.chart-wrap{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:16px}
.chart-wrap h3{font-size:11px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.chart-wrap canvas{max-height:220px}

/* log */
.logbox{background:#0d1117;border:1px solid #30363d;border-radius:8px;height:180px;overflow-y:auto;padding:8px 12px;font-family:monospace;font-size:11px;color:#8b949e}
.ll{padding:1px 0;white-space:pre-wrap;word-break:break-all}
.ll.t{color:#3fb950}.ll.x{color:#f85149}.ll.b{color:#d29922}.ll.e{color:#58a6ff}

/* loading */
.loading{text-align:center;padding:40px;color:#484f58;font-size:13px}

/* bar: block breakdown */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-row .blbl{width:130px;font-size:11px;color:#8b949e;text-align:right;flex-shrink:0}
.bar-row .btrack{flex:1;background:#21262d;border-radius:3px;height:12px;overflow:hidden}
.bar-row .bfill{height:100%;border-radius:3px;background:#58a6ff;transition:width .4s}
.bar-row .bval{width:45px;font-size:11px;color:#e6edf3;text-align:right;flex-shrink:0}

/* drift alert */
.drift-alert{background:#2d1f00;border:1px solid #d29922;border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:12px}
.drift-alert .da-title{color:#d29922;font-weight:700;margin-bottom:4px}
.drift-alert .da-body{color:#8b949e}

/* section divider */
.sec-divider{border-top:1px solid #30363d;margin:12px 0 16px;padding-top:8px}
.sec-label{font-size:11px;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── helpers ────────────────────────────────────────────────────────────────
function hms(iso){ return new Date(iso).toUTCString().slice(17,25); }
function hm(iso){ return new Date(iso).toUTCString().slice(17,22); }
function fmtDate(iso){ return iso ? iso.slice(0,10) : ""; }
function fmtPips(v){
  v = parseFloat(v);
  if(isNaN(v)) return <span className="pz">—</span>;
  return <span className={v>0?"pp":v<0?"pn":"pz"}>{v>0?"+":""}{v.toFixed(2)}</span>;
}
function minsOpen(t){ return ((Date.now()-t)/60000).toFixed(1); }
function pct(v){ return v==null?"—":v.toFixed(1)+"%"; }
function fmtNum(v,dec=2){ return v==null?"—":parseFloat(v).toFixed(dec); }

async function api(path){ const r=await fetch(path); return r.json(); }

// ── Top header ─────────────────────────────────────────────────────────────
function Header({ botStatus, ts }){
  return (
    <div className="hdr">
      <span className={`dot ${botStatus==="running"?"":"stopped"}`}/>
      <h1>FOREX ENGINE PRO v39.3 — Telemetry</h1>
      <div className="right">
        <span className="ts">{ts ? `updated ${hms(ts)} UTC` : "connecting…"}</span>
      </div>
    </div>
  );
}

// ── Tabs ───────────────────────────────────────────────────────────────────
const TABS = ["LIVE","ANALIZA","PIPELINE","WYKRESY","DECYZJE","WZORCE","EXCURSION","INSIGHTS","BLOCKED","FILTERED","LAB","KNOWLEDGE","SELECTED","EXPORT"];
function Tabs({ active, set }){
  return (
    <div className="tabs">
      {TABS.map(t => <div key={t} className={`tab ${active===t?"active":""}`} onClick={()=>set(t)}>{t}</div>)}
    </div>
  );
}

// ── LIVE tab ───────────────────────────────────────────────────────────────
function LiveTab({ live, today, logLines }){
  const [tick, setTick] = useState(0);
  useEffect(()=>{ const id=setInterval(()=>setTick(x=>x+1),3000); return()=>clearInterval(id); },[]);

  const trades = live.openTrades || [];
  const blocks = live.recentBlocks || [];

  return (
    <div className="page">
      <div className="cards">
        <div className="card"><div className="lbl">Bot Status</div>
          <div className={`val ${live.botStatus==="running"?"green":"red"}`}>{live.botStatus||"—"}</div></div>
        <div className="card"><div className="lbl">Open Trades</div>
          <div className="val blue">{trades.length}</div></div>
        <div className="card"><div className="lbl">Daily Trades</div>
          <div className="val">{live.dailyTrades||0}</div></div>
        <div className="card"><div className="lbl">Today Wins</div>
          <div className="val green">{today.wins||0}</div></div>
        <div className="card"><div className="lbl">Today Losses</div>
          <div className="val red">{today.losses||0}</div></div>
        <div className="card"><div className="lbl">Breakeven</div>
          <div className="val yellow">{today.breakevens||0}</div></div>
        <div className="card" title="WIN / (WIN + LOSS) — breakeveny nie liczą się do mianownika"><div className="lbl">Win Rate W/(W+L)</div>
          <div className="val">{today.winRate||"0.0"}%</div></div>
        <div className="card"><div className="lbl">Avg Peak</div>
          <div className="val">{today.avgPeak||"0.00"} p</div></div>
      </div>

      <div className="g2">
        <div className="panel">
          <div className="ph">Open Positions <span>{trades.length}</span></div>
          <div className="pb">
            {trades.length===0 ? <div className="empty">No open trades</div> : (
              <table><thead><tr>
                <th>Symbol</th><th>Side</th><th>Pips</th><th>Peak</th><th>BE</th><th>Open</th>
              </tr></thead><tbody>
                {trades.map(t=>(
                  <tr key={t.symbol}>
                    <td><b>{t.symbol}</b></td>
                    <td><span className={`tag ${t.side}`}>{t.side.toUpperCase()}</span></td>
                    <td>{fmtPips(t.pips)}</td>
                    <td>{fmtPips(t.peak)}</td>
                    <td>{t.breakEven?<span className="tag be">BE</span>:""}</td>
                    <td>{minsOpen(t.entryTime)} m</td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>

        <div className="panel">
          <div className="ph">Active Blocks <span>{blocks.length}</span></div>
          <div className="pb short">
            {blocks.length===0 ? <div className="empty">No blocks</div> : (
              <table><thead><tr><th>UTC</th><th>Event</th></tr></thead><tbody>
                {blocks.map((b,i)=>(
                  <tr key={i}><td className="pz">{hms(b.t)}</td><td>{b.line}</td></tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="ph">Live Log</div>
        <div className="logbox" id="livelog">
          {logLines.map((l,i)=>(
            <div key={i} className={`ll${l.line.startsWith("Trade ->")||l.line.includes("CONFIRMED")?" t":l.line.startsWith("EXIT")?" x":l.line.includes("BLOCK")?" b":l.line.includes("BREAK EVEN")?" e":""}`}>
              {hms(l.t)} {l.line}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── ANALIZA tab ────────────────────────────────────────────────────────────
function AnalyzaTab({ stats, today, symbols, confirmLag, exitMgr }){
  const totalBlocks = Object.values(today.blockCounts||{}).reduce((a,b)=>a+b,0);
  const blockTypes = [
    {key:"spread_block",         label:"Spread"},
    {key:"pullback_block",       label:"Pullback"},
    {key:"cooldown_block",       label:"Cooldown"},
    {key:"correlation_block",    label:"Correlation"},
    {key:"margin_block",         label:"Margin"},
    {key:"exhaustion_block",     label:"Exhaustion"},
    {key:"spread_edge_block",    label:"Spread Edge"},
    {key:"symbol_disabled_block",label:"Disabled Symbol"},
  ];

  return (
    <div className="page">
      <div className="cards">
        <div className="card"><div className="lbl">Total Trades</div><div className="val blue">{stats.trades||0}</div></div>
        <div className="card"><div className="lbl">Wins</div><div className="val green">{stats.wins||0}</div></div>
        <div className="card"><div className="lbl">Losses</div><div className="val red">{stats.losses||0}</div></div>
        <div className="card"><div className="lbl">Breakeven</div><div className="val yellow">{stats.breakevens||0}</div></div>
        <div className="card" title="WIN / (WIN + LOSS) — breakeveny nie liczą się do mianownika"><div className="lbl">Win Rate W/(W+L)</div><div className="val">{stats.winRate||"0.0"}%</div></div>
        <div className="card"><div className="lbl">Avg Peak</div><div className="val">{stats.avgPeak||"0.00"} p</div></div>
        <div className="card"><div className="lbl">Avg Duration</div><div className="val">{stats.avgDuration||"0.0"} m</div></div>
        <div className="card"><div className="lbl">Checks</div><div className="val yellow">{stats.checksTotal||0}</div></div>
      </div>

      <div className="g2">
        <div className="panel">
          <div className="ph">Block Breakdown — Today</div>
          <div style={{padding:"16px"}}>
            {blockTypes.map(({key,label})=>{
              const n = (today.blockCounts||{})[key]||0;
              const pct = totalBlocks>0 ? Math.round(n/totalBlocks*100) : 0;
              return (
                <div className="bar-row" key={key}>
                  <div className="blbl">{label}</div>
                  <div className="btrack"><div className="bfill" style={{width:pct+"%"}}/></div>
                  <div className="bval">{n} <span className="pz">({pct}%)</span></div>
                </div>
              );
            })}
            {totalBlocks===0&&<div className="empty">No blocks today</div>}
          </div>
        </div>

        <div className="panel">
          <div className="ph">Performance per Symbol</div>
          <div className="pb">
            {symbols.length===0 ? <div className="empty">No data</div> : (
              <table><thead><tr>
                <th>Symbol</th><th>Trades</th><th>Win%</th><th>Avg P</th><th>Avg Peak</th>
              </tr></thead><tbody>
                {symbols.map(s=>(
                  <tr key={s.symbol}>
                    <td><b>{s.symbol}</b></td>
                    <td>{s.trades}</td>
                    <td><span className={parseFloat(s.winRate)>=50?"pp":"pn"}>{s.winRate}%</span></td>
                    <td>{fmtPips(s.avgProfit)}</td>
                    <td>{fmtPips(s.avgPeak)}</td>
                  </tr>
                ))}
              </tbody></table>
            )}
          </div>
        </div>
      </div>

      {/* ── Confirmation Lag Analysis ── */}
      <div className="panel">
        <div className="ph">
          Confirmation Lag — które warunki blokują wejście najczęściej
          <span style={{fontWeight:400,color:"#484f58"}}>checks: {(confirmLag.totalChecks||0)} · post-entry failures: {(confirmLag.postEntryFailures||0)}</span>
        </div>
        {(confirmLag.conditions||[]).length===0
          ? <div className="empty" style={{padding:20}}>Brak danych — za mało buy/sell check events</div>
          : (
            <table>
              <thead><tr>
                <th>Warunek</th>
                <th style={{textAlign:"right"}}>TRUE</th>
                <th style={{textAlign:"right"}}>FALSE</th>
                <th style={{textAlign:"right"}}>TRUE %</th>
                <th style={{textAlign:"right"}}>Ocena</th>
              </tr></thead>
              <tbody>
                {(confirmLag.conditions||[]).map(c=>{
                  const rate = c.trueRate ?? 0;
                  const col  = rate < 30 ? "#f85149" : rate < 60 ? "#d29922" : "#3fb950";
                  const tag  = rate < 30 ? "⚠ BLOCKER" : rate < 60 ? "~ partial" : "✓ ok";
                  return (
                    <tr key={c.condition}>
                      <td style={{fontWeight:600}}>{c.condition}</td>
                      <td style={{textAlign:"right",color:"#3fb950"}}>{c.trueN}</td>
                      <td style={{textAlign:"right",color:"#f85149"}}>{c.falseN}</td>
                      <td style={{textAlign:"right"}}>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:8}}>
                          <div style={{width:80,background:"#21262d",borderRadius:3,height:8,overflow:"hidden"}}>
                            <div style={{width:rate+"%",height:"100%",background:col,borderRadius:3}}/>
                          </div>
                          <span style={{color:col,fontWeight:700,minWidth:40}}>{rate}%</span>
                        </div>
                      </td>
                      <td style={{textAlign:"right",color:col,fontSize:11}}>{tag}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )
        }
      </div>
      <ExitManagerSection data={exitMgr}/>
    </div>
  );
}

// ── EXIT MANAGER section ────────────────────────────────────────────────────
function ExitManagerSection({ data }){
  if(!data) return <div className="panel"><div className="ph">EXIT ANALYSIS</div><div className="empty" style={{padding:16}}>Loading…</div></div>;
  const { avg_mfe_capture_pct, avg_profit_given_back, avg_retained_profit, exit_efficiency,
          avg_mfe30, avg_mfe60, avg_mfe120, sampleMfe30=0, totalTrades=0,
          reasonDistribution=[],
          floor_triggered_count=0, avg_saved_pips=null, avg_protected_profit=null } = data;
  const effCol = v => v==null?"#484f58":v>=60?"#3fb950":v>=30?"#d29922":"#f85149";
  return (
    <div className="panel">
      <div className="ph">EXIT ANALYSIS
        <span style={{fontWeight:400,color:"#484f58"}}>MFE capture + exit reason distribution — {totalTrades} trade{totalTrades!==1?"s":""}</span>
      </div>
      <div className="cards" style={{margin:"12px 0"}}>
        <div className="card"><div className="lbl">Avg Retained Profit</div><div className="val" style={{color:effCol(avg_retained_profit)}}>{avg_retained_profit!=null?avg_retained_profit+"%":"—"}</div></div>
        <div className="card"><div className="lbl">Avg MFE Capture %</div><div className="val" style={{color:effCol(avg_mfe_capture_pct)}}>{avg_mfe_capture_pct!=null?avg_mfe_capture_pct+"%":"—"}</div></div>
        <div className="card"><div className="lbl">Exit Efficiency</div><div className="val" style={{color:effCol(exit_efficiency)}}>{exit_efficiency!=null?exit_efficiency+"%":"—"}</div></div>
        <div className="card"><div className="lbl">Avg Given Back</div><div className="val red">{avg_profit_given_back!=null?avg_profit_given_back+"p":"—"}</div></div>
        <div className="card"><div className="lbl">Avg MFE @ 30s</div><div className="val blue">{avg_mfe30!=null?avg_mfe30+"p":"—"}</div></div>
        <div className="card"><div className="lbl">Avg MFE @ 60s</div><div className="val blue">{avg_mfe60!=null?avg_mfe60+"p":"—"}</div></div>
        <div className="card"><div className="lbl">Avg MFE @ 120s</div><div className="val blue">{avg_mfe120!=null?avg_mfe120+"p":"—"}</div></div>
      </div>
      {(floor_triggered_count>0||avg_saved_pips!=null||avg_protected_profit!=null) && (
        <div style={{padding:"0 16px 4px"}}>
          <div style={{fontWeight:600,fontSize:11,color:"#3fb950",textTransform:"uppercase",letterSpacing:".8px",marginBottom:8}}>
            ▼ EXIT FLOOR PROTECTION (v39.4) — MFE ≥ 2p → floor = MAX(0, MFE × 0.35)
          </div>
          <div className="cards">
            <div className="card">
              <div className="lbl">Protected Exits</div>
              <div className="val" style={{color:floor_triggered_count>0?"#3fb950":"#484f58"}}>{floor_triggered_count}</div>
            </div>
            <div className="card">
              <div className="lbl">Avg Saved Pips</div>
              <div className="val" style={{color:avg_saved_pips!=null?"#3fb950":"#484f58"}}>{avg_saved_pips!=null?avg_saved_pips+"p":"—"}</div>
            </div>
            <div className="card">
              <div className="lbl">Avg Protected Profit</div>
              <div className="val blue">{avg_protected_profit!=null?avg_protected_profit+"p":"—"}</div>
            </div>
          </div>
        </div>
      )}
      {totalTrades>0 && sampleMfe30===0 && (
        <div style={{padding:"0 16px 4px",fontSize:11,color:"#484f58"}}>
          ℹ MFE time snapshots (30s/60s/120s) accumulate from new trades only.
        </div>
      )}
      {reasonDistribution.length>0 && (
        <div style={{padding:"0 0 16px"}}>
          <div style={{fontWeight:600,fontSize:12,color:"#79c0ff",padding:"10px 16px 6px",textTransform:"uppercase",letterSpacing:".8px"}}>
            Exit Reason Distribution
          </div>
          <table>
            <thead><tr>
              <th>Exit Reason</th>
              <th style={{textAlign:"right"}}>Count</th>

// ── AI COMPLETE ANALYSIS REPORT v2 — pure client-side builder ────────────────
// Read-only: assembles a full architectural report from existing GET endpoints.
// Zero server change, zero DB writes, zero Live Bot impact. Every input may be
// null (endpoint failed) — every formatter below is defensive.
const RPT_W = 50;
function rptHdr(t){ return ["", "=".repeat(RPT_W), t, "=".repeat(RPT_W), ""]; }
function rptSub(t){ return ["", "--- " + t + " ---"]; }
function rv(v, suf){ return (v==null || v==="") ? "N/A" : String(v) + (suf||""); }
function rnum(v, d, suf){ const x = Number(v); return (v==null || isNaN(x)) ? "N/A" : x.toFixed(d==null?2:d) + (suf||""); }
function rjson(v){ try { return JSON.stringify(v); } catch(_){ return String(v); } }
function knParse(resp){
  if(!resp || resp.ok===false || !resp.result) return null;
  const row = resp.result;
  let value = row.value;
  if (typeof value === "string") { try { value = JSON.parse(value); } catch(_){} }
  return { row, value };
}

  const {

  } = d;
  const L = [];

  // ════════ LIVE BOT (unchanged legacy report) ════════

  {
    const obs = [];
    const engs = (labRanking && labRanking.engines) || [];
    const withExp = engs.filter(e=>e.expectancy!=null);
    if (withExp.length){
      const best = withExp[0], worst = withExp[withExp.length-1];
      obs.push(`  [BEST]  ${best.label||best.id} leads virtual expectancy at ${rnum(best.expectancy,2,"p")}.`);
      if (worst !== best) obs.push(`  [WORST] ${worst.label||worst.id} trails at ${rnum(worst.expectancy,2,"p")}.`);
    }
    const bySym = (labComparison && labComparison.bySymbol) || [];
    const agree = bySym.filter(s=>s.avgAgreement!=null);
    if (agree.length){
      const ba = [...agree].sort((a,b)=>b.avgAgreement-a.avgAgreement);
      obs.push(`  [BEST]  Highest engine agreement: ${ba[0].symbol} (${rnum(ba[0].avgAgreement,1,"%")}).`);
      const bc = [...bySym].filter(s=>s.cautionRate!=null).sort((a,b)=>b.cautionRate-a.cautionRate);
      if (bc.length && bc[0].cautionRate > 0) obs.push(`  [WORST] Highest caution rate: ${bc[0].symbol} (${rnum(bc[0].cautionRate,1,"%")}).`);
    }
    if (exitLab?.stats?.totalProfitSaved != null){
      const t = exitLab.stats.totalProfitSaved;
      obs.push(t > 0 ? `  [BEST]  Exit Lab strategies saved a cumulative ${rnum(t,1,"p")} vs live exits.`
                     : `  [WORST] Exit Lab strategies show no cumulative saving vs live exits (${rnum(t,1,"p")}).`);
    }
    if (labRanking?.dataQualityNote && String(labRanking.dataQualityNote).indexOf("ADEQUATE") !== 0)
      obs.push(`  [WORST] Data quality: ${labRanking.dataQualityNote}`);
    push(...(obs.length?obs:["  N/A (insufficient data)"]));
  }

  // ════════ KNOWLEDGE LAYER ════════
  push(...rptHdr("KNOWLEDGE LAYER"));
  const snaps = (knSnapshots && knSnapshots.snapshots) || [];
  // Single source of truth for "active knowledge artifacts": prefer the status
  // endpoint, fall back to the artifact list — so ACTIVE ARTIFACTS, PIPELINE
  // HEALTH and AI SUMMARY always agree, even when one endpoint failed this run.
  const knArtifactList = (knArtifacts && Array.isArray(knArtifacts.artifacts)) ? knArtifacts.artifacts : [];
  const knActiveCount =
    (knStatus && knStatus.artifacts && knStatus.artifacts.active != null && !isNaN(Number(knStatus.artifacts.active)))
      ? Number(knStatus.artifacts.active)
      : (knArtifactList.length ? knArtifactList.length : (knArtifacts ? 0 : null));
  const knDomainsFromStatus = (knStatus?.byDomain||[]).map(x=>x.domain);
  const knDomains = knDomainsFromStatus.length
    ? knDomainsFromStatus
    : Array.from(new Set(knArtifactList.map(a=>a.domain)));
  push(...rptSub("SNAPSHOT / MANIFEST"));
  if (snaps.length){
    const s0 = snaps[0];
    push(
      `  Latest snapshot id (manifest version): ${rv(s0.id)}`,
      `  Manifest checksum: ${rv(s0.manifest_checksum)}`,
      `  Artifact count: ${rv(s0.artifact_count)}  total bytes: ${rv(s0.total_bytes)}`,
      `  Created: ${rv(s0.created_at)}`,
      `  Snapshots recorded: ${rv(knSnapshots.count)}`,
    );
  } else push("  N/A (no snapshots yet)");

  push(...rptSub("GROWTH SINCE PREVIOUS SNAPSHOT"));
  if (snaps.length >= 2){
    const s0 = snaps[0], s1 = snaps[1];
    push(
      `  Previous snapshot id: ${rv(s1.id)} (${rv(s1.created_at)})`,
      `  Artifacts: ${rv(s1.artifact_count)} -> ${rv(s0.artifact_count)} (${Number(s0.artifact_count||0)-Number(s1.artifact_count||0) >= 0 ? "+" : ""}${Number(s0.artifact_count||0)-Number(s1.artifact_count||0)})`,
      `  Bytes: ${rv(s1.total_bytes)} -> ${rv(s0.total_bytes)} (${Number(s0.total_bytes||0)-Number(s1.total_bytes||0) >= 0 ? "+" : ""}${Number(s0.total_bytes||0)-Number(s1.total_bytes||0)})`,
      `  Manifest changed: ${s0.manifest_checksum !== s1.manifest_checksum}`,
    );
  } else push("  N/A (fewer than 2 snapshots)");

  push(...rptSub("STORE STATISTICS"));
  if (knStatus){
    push(
      `  Builder enabled (KNOWLEDGE_LAYER): ${rv(knStatus.knowledgeEnabled)}`,
      `  Artifacts: total ${rv(knStatus.artifacts?.total)}, active ${rv(knStatus.artifacts?.active)}, superseded ${rv(knStatus.artifacts?.superseded)}, active bytes ${rv(knStatus.artifacts?.activeBytes)}`,
      `  Domains: ${(knStatus.byDomain||[]).map(x=>`${x.domain}(${x.active})`).join(", ")||"N/A"}`,
      `  Snapshots: ${rv(knStatus.snapshots?.total)} (latest ${rv(knStatus.snapshots?.latest)})`,
      `  System version: ${rv(knStatus.systemVersion)}  run: ${rv(knStatus.provenance?.runId)}`,
    );
    if (knStatus.lastBuild) push(`  Last build: ${rjson(knStatus.lastBuild)}`);
    else push("  Last build: none this process (builder idle or disabled)");
  } else push("  N/A");

  push(...rptSub("ACTIVE ARTIFACTS (VERSIONS)"));
  if (knArtifactList.length)
    push(...knArtifactList.map(a=>`  ${a.domain}/${a.artifact} v${a.version} — confidence ${rv(a.confidence)}, trainingEvents ${rv(a.training_events)}, ${rv(a.byte_size)}B, created ${rv(a.created_at)}`));
  else push("  N/A (no active artifacts)");

  const kc = knParse(knConfidence);
  push(...rptSub("CONFIDENCE HISTORY (confidence/history)"));
  if (kc && kc.value && kc.value.byScope){
    for (const [scope, arr] of Object.entries(kc.value.byScope))
      push(`  ${scope}: ${(arr||[]).map(x=>`${x.confidenceLevel}(${x.points}pt, resolved ${x.minResolved}-${x.maxResolved})`).join(" -> ")}`);
  } else push("  N/A");

  const ke = knParse(knExpectancy);
  push(...rptSub("EXPECTANCY HISTORY (expectancy/history)"));
  if (ke && ke.value && Array.isArray(ke.value.scopes)){
    push(...ke.value.scopes.slice(0,8).map(s=>`  ${s.scope}: ${s.points} points, latest expectancy ${rnum(s.latest?.expectancyPips,2,"p")}, PF ${rv(s.latest?.profitFactor)}, resolved ${rv(s.latest?.resolvedTrades)}, confidence ${rv(s.latest?.confidenceLevel)}`));
  } else push("  N/A");

  const kx = knParse(knExperiments);
  push(...rptSub("EXPERIMENTS METADATA (experiments/metadata)"));
  if (kx && kx.value && Array.isArray(kx.value.experiments)){
    push(`  Experiments (run/build/config combos): ${rv(kx.value.experimentCount)}`);
    push(...kx.value.experiments.slice(0,5).map(e=>`  run ${String(e.runId||"").slice(0,12)}… build ${rv(e.buildId)}: signals ${e.signals}, evals ${e.evals}, outcomes ${e.outcomes} (${rv(e.firstAt)} -> ${rv(e.lastAt)})`));
  } else push("  N/A");

  const kf = knParse(knFingerprints);
  push(...rptSub("MARKET FINGERPRINTS (market/fingerprints)"));
  if (kf && kf.value && Array.isArray(kf.value.fingerprints)){
    push(`  Distinct fingerprints: ${rv(kf.value.fingerprintCount)}`);
    push(...kf.value.fingerprints.slice(0,5).map(f=>`  ${String(f.fingerprint).slice(0,40)}: ${f.signals} signals, ${f.resolved} resolved, avg ${rnum(f.avgProfitPips,2,"p")}`));
  } else push("  N/A");

  const kp = knParse(knPatterns);
  push(...rptSub("VALIDATED PATTERNS (patterns/validated)"));
  if (kp && kp.value && Array.isArray(kp.value.patterns)){
    push(`  Patterns: ${rv(kp.value.patternCount)}  validated: ${rv(kp.value.validatedCount)} (min sample ${rv(kp.value.validationMinSample)})`);
    push(...kp.value.patterns.filter(p=>p.validated).slice(0,5).map(p=>`  [VALID] ${p.symbol} ${p.side} ${p.trendBucket}/${p.volatilityBucket}/${p.spreadBucket}: WR ${rnum(p.winrate==null?null:p.winrate*100,1,"%")}, expectancy ${rnum(p.expectancyPips,2,"p")} (${p.resolved} resolved)`));
    push(...kp.value.patterns.filter(p=>!p.validated).slice(0,3).map(p=>`  [obs]   ${p.symbol} ${p.side} ${p.trendBucket}/${p.volatilityBucket}/${p.spreadBucket}: ${p.resolved} resolved, expectancy ${rnum(p.expectancyPips,2,"p")}`));
  } else push("  N/A");

  // ════════ SELECTED ENGINE ════════
  push(...rptHdr("SELECTED ENGINE"));
  const ctx = (selContext && selContext.context) || null;
  push(...rptSub("DECISION CONTEXT"));
  if (ctx){
    push(
      `  Context id: ${rv(ctx.id)}  (schema v${rv(ctx.schemaVersion)})`,
      `  Signal: ${rv(ctx.liveSignal?.signalId)}  symbol ${rv(ctx.symbol)}  side ${rv(ctx.liveSignal?.side)}  session ${rv(ctx.liveSignal?.session)}`,
      `  Built: ${rv(ctx.metadata?.generated)}  engines: ${rv(ctx.metadata?.engineCount)} [${(ctx.metadata?.engineIds||[]).join(", ")}]`,
      `  Resolved outcome: ${ctx.metadata?.resolved ? rjson(ctx.metadata.outcome) : "not resolved yet"}`,
    );
  } else push("  N/A (no DecisionContext — no recorded signals yet)");

  push(...rptSub("CONSENSUS & DISAGREEMENT"));
  if (ctx){
    const cd = ctx.consensusDetail || {};
    push(
      `  Consensus: ${rv(ctx.consensus)}  agreement ${rv(ctx.agreementScore,"%")}  disagreement ${rv(ctx.disagreementScore,"%")}`,
      `  Agreeing: [${(cd.agreeing||[]).join(", ")}]  dissenting: [${(cd.dissenting||[]).join(", ")}]  abstaining: [${(cd.abstaining||[]).join(", ")}]  decided: ${rv(cd.decided)}`,
    );
  } else push("  N/A");

  push(...rptSub("CONFIDENCE"));
  if (ctx && ctx.confidence){
    push(`  Tier: ${rv(ctx.confidence.tier)}  average: ${rv(ctx.confidence.average)}`);
    if (ctx.confidence.perEngine) push(`  Per engine: ${rjson(ctx.confidence.perEngine)}`);
  } else push("  N/A");

  push(...rptSub("ENGINE OPINIONS"));
  if (ctx && ctx.engines && Object.keys(ctx.engines).length){
    for (const [eid, op] of Object.entries(ctx.engines)){
      push(`  Engine ${eid}: wouldTrade=${rv(op?.wouldTrade)} confidence=${rv(op?.confidence)} score=${rv(op?.score)} histWR=${rv(op?.historicalWinrate)} histExp=${rv(op?.historicalExpectancy)}`);
    }
  } else push("  N/A");

  push(...rptSub("RANKING (Confidence -> Expectancy -> TrainingEvents -> Version -> Freshness)"));
  if (ctx && Array.isArray(ctx.ranking) && ctx.ranking.length)
    push(...ctx.ranking.slice(0,8).map((r,i)=>`  #${i+1} ${r.source} [${rv(r.kind)}] confidence ${rv(r.confidence)}, expectancy ${rv(r.expectancy)}, trainingEvents ${rv(r.trainingEvents)}`));
  else push("  N/A");

  push(...rptSub("EXPLAINABILITY"));
  if (ctx && ctx.explainability){
    const ex = ctx.explainability;
    push(
      `  Why selected: ${rv(ex.selectionReason || ctx.selectedReason)}`,
      `  Top ranked sources: [${((ex.evidenceSummary&&ex.evidenceSummary.topSources)||[]).join(", ")}]`,
      `  Selected sources: [${(ex.selectedSources||[]).map(s=>(s&&typeof s==="object")?s.source:s).join(", ")}]`,
      `  Confidence chain: tier ${rv(ex.confidenceChain?.tier)}, avg ${rv(ex.confidenceChain?.average)}`,
      `  Knowledge versions: max ${rv(ex.knowledgeVersions?.max)}, snapshot ${rjson(ex.knowledgeVersions?.snapshot||null)}`,
      `  Market fingerprint: ${rjson((ex.evidenceSummary&&ex.evidenceSummary.marketFingerprint)||null)}`,
    );
  } else push(`  Why selected: ${rv(ctx && ctx.selectedReason)}`);

  push(...rptSub("EVIDENCE TRACE (REPRODUCIBLE)"));
  if (ctx && ctx.evidenceTrace){
    const tr = ctx.evidenceTrace;
    push(
      `  Checksum (content-only, restart-stable): ${rv(tr.checksum)}`,
      `  Records: ${(tr.records||[]).length}  knowledge artifacts: ${(tr.artifacts||[]).length}  engines: [${(tr.engineIds||[]).join(", ")}]`,
      `  Snapshot checksum: ${rv(tr.snapshotChecksum)}`,
      `  Ranking criteria embedded: ${tr.rankingCriteria ? "yes (RANKING_CRITERIA v" + rv(tr.rankingCriteria.version) + ")" : "no"}`,
    );
  } else push("  N/A");

  push(...rptSub("KNOWLEDGE vs ENGINE CONTRIBUTION"));
  if (ctx && Array.isArray(ctx.ranking) && ctx.ranking.length){
    const kn = ctx.ranking.filter(r=>String(r.source||"").indexOf("knowledge:")===0).length;
    const en = ctx.ranking.filter(r=>String(r.source||"").indexOf("engine:")===0).length;
    const other = ctx.ranking.length - kn - en;
    const top = ctx.ranking[0];
    push(
      `  Ranking inputs: ${en} engine source(s), ${kn} knowledge source(s), ${other} other`,
      `  Top-ranked source kind: ${rv(top && top.source)}`,
      `  Knowledge contribution: ${kn>0 ? `${kn} artifact-backed record(s) in ranking (versions: ${rjson((ctx.explainability&&ctx.explainability.knowledgeVersions&&ctx.explainability.knowledgeVersions.artifacts)||{})})` : "none — decision is engine-only"}`,
      `  Engine contribution: ${en>0 ? `${en} live engine opinion(s); decided ${rv(ctx.consensusDetail?.decided)} of ${Object.keys(ctx.engines||{}).length}` : "none"}`,
    );
  } else push("  N/A");

  push(...rptSub("FINAL REASONING"));
  if (ctx){
    push(`  ${rv(ctx.selectedReason)}`);
  } else push("  N/A");

  if (selStatus) push(
    "",
    `  [status] running=${rv(selStatus.running)} (SELECTED_ENGINE flag gates background refresh only)`,
    `  [status] ring ${rv(selStatus.ring?.size)}/${rv(selStatus.ring?.capacity)} cached contexts, builds ${rv(selStatus.stats?.builds)}, last build ${rv(selStatus.stats?.lastBuildAt)}`,
    `  [status] knowledge domains visible: [${(selStatus.knowledgeDomains||[]).join(", ")}]  knowledge version ${rv(selStatus.knowledgeVersion)}`,
  );

  // ════════ SELECTED ADVISOR ANALYSIS (Sprint 7 Phase 1 — observational only) ════════
  push(...rptHdr("SELECTED ADVISOR ANALYSIS"));
  const advList = (advisories && Array.isArray(advisories.advisories)) ? advisories.advisories : [];
  // Advisories recorded before Sprint 7 Phase 1 lack the normalized `status`
  // field — derive it from the detailed advisor.status for backward compat.
  const advStatusOf = (a) => a.status
    || (a.advisor && a.advisor.status === "OK" ? "OK"
        : a.advisor && a.advisor.status === "ERROR" ? "ERROR" : "NOT_AVAILABLE");
  push("  Mode: OBSERVATIONAL ONLY — opinions recorded strictly AFTER each Live Bot decision; the advisor never influences trading.");
  if (advisories) push(`  Advisor enabled (SELECTED_ADVISOR): ${rv(advisories.advisorEnabled)}  observed opens: ${rv(advisories.status?.counters?.observed)}  full advisories: ${rv(advisories.status?.counters?.advisories)}  stubs: ${rv(advisories.status?.counters?.stubs)}  swallowed errors: ${rv(advisories.status?.counters?.errors)}`);
  if (!advList.length){
    push("  N/A — advisory ring is empty (in-memory, resets on restart; fills as live trades open; non-stub opinions require SHADOW_LAB_RESEARCH=on).");
  } else {
    const advOk = advList.filter(a=>advStatusOf(a)==="OK");
    push(...rptSub("STATUS BREAKDOWN"));
    push(`  OK (opinion attached): ${advOk.length}   NOT_AVAILABLE (no DecisionContext): ${advList.filter(a=>advStatusOf(a)==="NOT_AVAILABLE").length}   ERROR: ${advList.filter(a=>advStatusOf(a)==="ERROR").length}   (window: last ${advList.length})`);
    push(...rptSub("CONFIDENCE DISTRIBUTION"));
    const advTier = t => advOk.filter(a=>a.selectedConfidence && a.selectedConfidence.tier===t).length;
    push(`  HIGH: ${advTier("HIGH")}   MEDIUM: ${advTier("MEDIUM")}   LOW: ${advTier("LOW")}`);
    push(...rptSub("SELECTED DECISIONS"));
    const advDec = v => advOk.filter(a=>a.selectedDecision===v).length;
    push(`  TRADE: ${advDec("TRADE")}   NO_TRADE: ${advDec("NO_TRADE")}   SPLIT: ${advDec("SPLIT")}   ABSTAIN: ${advDec("ABSTAIN")}`);
    push(...rptSub("AGREEMENT WITH LIVE BOT"));
    // Every advisory corresponds to a trade the Live Bot EXECUTED, so
    // agreement = Selected also said TRADE (among decided TRADE/NO_TRADE opinions).
    const advDecided = advOk.filter(a=>a.selectedDecision==="TRADE" || a.selectedDecision==="NO_TRADE");
    const advAgree = advDecided.filter(a=>a.selectedDecision==="TRADE").length;
    push(advDecided.length
      ? `  ${advAgree}/${advDecided.length} decided opinions agreed with the Live Bot (${(advAgree/advDecided.length*100).toFixed(1)}%).`
      : "  N/A — no decided (TRADE/NO_TRADE) opinions in the window yet.");
    push(...rptSub("AVERAGE CONSENSUS"));
    const advScores = advOk.map(a=>a.selectedConsensus ? a.selectedConsensus.agreementScore : null).filter(v=>v!=null && !isNaN(Number(v)));
    push(advScores.length
      ? `  Average agreementScore: ${(advScores.reduce((s,v)=>s+Number(v),0)/advScores.length).toFixed(1)}% across ${advScores.length} opinion(s).`
      : "  N/A — no consensus scores available.");
  }

  // ════════ PIPELINE HEALTH ════════
  push(...rptHdr("PIPELINE HEALTH"));
  push(...rptSub("INGESTION (LIVE SIGNAL PIPELINE)"));
  if (pipeline){
    const wf = pipeline.waterfall||[];
    const first = wf[0], gate = wf.find(w=>String(w.stage||"").indexOf("Reached Gate")===0);
    push(
      `  Signals detected: ${rv(first && first.survivors)}  reached gate: ${rv(gate && gate.survivors)}  trades opened: ${rv(pipeline.tradeOpens)}  closed: ${rv(pipeline.tradeCloses)}`,
      `  Outcomes: ${rv(pipeline.wins)}W / ${rv(pipeline.losses)}L / ${rv(pipeline.breakevens)}BE`,
      `  Dominant blocker: ${pipeline.dominantBlocker ? `${pipeline.dominantBlocker.name} (${pipeline.dominantBlocker.count})` : "none"}  terminal: ${rv(pipeline.terminalBlocker)}`,
      `  Silent leakage: ${rv(pipeline.silentLeakage)}`,
    );
  } else push("  N/A");

  push(...rptSub("SHADOW / RESEARCH STAGE"));
  push(`  Lab comparisons: ${rv(labOverview?.totalProcessed)}  research signals: ${rv(research?.counts?.signals)}  evals: ${rv(research?.counts?.engineEvals)}  outcomes: ${rv(research?.counts?.outcomes)}`);
  push(`  Research reconciler enabled (SHADOW_LAB_RESEARCH): ${rv(research?.researchEnabled)}`);

  push(...rptSub("KNOWLEDGE STAGE"));
  push(`  Builder enabled (KNOWLEDGE_LAYER): ${rv(knStatus?.knowledgeEnabled)}  active artifacts: ${rv(knActiveCount)}  snapshots: ${rv(knStatus?.snapshots?.total)}`);

  push(...rptSub("SELECTED STAGE"));
  push(`  Background refresh (SELECTED_ENGINE): ${rv(selStatus?.running)}  builds: ${rv(selStatus?.stats?.builds)}  context available: ${ctx ? "yes" : "no"}`);

  push(...rptSub("TELEMETRY & PERSISTENCE"));
  if (healthz){
    push(
      `  DB backend: ${rv(healthz.dbBackend)} (persistent: ${rv(healthz.persistence)})`,
      `  Event counts: ${rjson(healthz.eventCounts||{})}`,
      `  Shadow mode: ${rv(healthz.shadowMode)}  live open trades: ${(healthz.liveOpenTrades||[]).length}`,
    );
  } else push("  N/A");
  if (memInteg) push(`  Memory integration: ${rjson(memInteg)}`);

  push(...rptSub("POLLING & CACHE"));
  push(
    `  Shadow M poll: event-driven cursor (see healthz shadowM: ${rjson(healthz?.shadowM?.tradesObserved!=null?{tradesObserved:healthz.shadowM.tradesObserved}:null)})`,
    `  Knowledge builder poll: 15 min (unref'd), enabled=${rv(knStatus?.knowledgeEnabled)}`,
    `  Selected Engine poll: unref'd background refresh, running=${rv(selStatus?.running)}`,
    `  Selected ring cache: ${rv(selStatus?.ring?.size)}/${rv(selStatus?.ring?.capacity)}`,
  );

  push(...rptSub("EXPORT STAGE (THIS REPORT)"));
  {
    const tKeys = Object.keys(timings||{});
    const totalMs = tKeys.reduce((s,k)=>s+(timings[k]||0),0);
    const slow = tKeys.map(k=>[k,timings[k]]).sort((a,b)=>b[1]-a[1]).slice(0,5);
    push(
      `  Endpoints fetched: ${tKeys.length}  failed: ${(failures||[]).length}`,
      `  Cumulative fetch time: ${totalMs}ms`,
      `  Slowest endpoints: ${slow.map(([k,v])=>`${k} (${v}ms)`).join(", ")||"N/A"}`,
    );
  }

  push(...rptSub("FAILURES"));
  const fails = [];
  for (const f of (failures||[])) fails.push(`  [FETCH] ${f}`);
  for (const f of ((pipeline&&pipeline.findings)||[]).filter(x=>x.severity==="CRITICAL"||x.severity==="HIGH"))
    fails.push(`  [${f.severity}] (${f.classification}) ${f.finding}`);
  push(...(fails.length?fails:["  none"]));

  push(...rptSub("WARNINGS"));
  const warns = [];
  if (labRanking?.dataQualityNote && String(labRanking.dataQualityNote).indexOf("ADEQUATE")!==0) warns.push(`  [DATA] ${labRanking.dataQualityNote}`);
  for (const f of ((pipeline&&pipeline.findings)||[]).filter(x=>x.severity==="INFO")) warns.push(`  [INFO] (${f.classification}) ${f.finding}`);
  if (knStatus && knStatus.knowledgeEnabled===false) warns.push("  [FLAG] KNOWLEDGE_LAYER is OFF — artifacts refresh only when the flag is enabled.");
  if (selStatus && selStatus.running===false) warns.push("  [FLAG] SELECTED_ENGINE background refresh is OFF — contexts build on demand only.");
  if (research && research.researchEnabled===false) warns.push("  [FLAG] SHADOW_LAB_RESEARCH is OFF — research reconciler is not appending new research rows.");
  push(...(warns.length?warns:["  none"]));

  // ════════ TELEMETRY HEALTH (Sprint 7.2 — close-capture completeness) ════════
  push(...rptHdr("TELEMETRY HEALTH"));
  if (telemetryHealth){
    const th = telemetryHealth, rc = th.reconciler || {};
    push(...rptSub("CLOSE-CAPTURE COMPLETENESS"));
    push(
      `  Expected trade closes: ${rv(th.expected_trade_closes)}`,
      `  Captured trade closes: ${rv(th.captured_trade_closes)}  (native software exits: ${rv(th.breakdown?.native)}, synthetic via OANDA reconciler: ${rv(th.breakdown?.synthetic)})`,
      `  Missing trade closes:  ${rv(th.missing_trade_closes)}`,
      `  Completeness:          ${th.telemetry_completeness_pct==null ? "UNKNOWN (reconciler dormant — flag off or no OANDA creds)" : th.telemetry_completeness_pct+"%"}`,
    );
    const sbr = (th.breakdown && th.breakdown.syntheticByReason) || {};
    const sbrKeys = Object.keys(sbr);
    if (sbrKeys.length){
      push("  Synthetic closes by reason:");
      for (const k of sbrKeys) push(`    ${k}: ${sbr[k]}`);
    }
    push(...rptSub("RECONCILER (TELEMETRY_RECONCILER)"));
    push(
      `  Flag: ${rc.flagEnabled===false?"OFF":"ON"}  running: ${rv(rc.enabled)}  OANDA creds: ${rv(rc.credsPresent)}  polls: ${rv(rc.pollCount)}`,
      `  Native-matched: ${rv(rc.nativeMatched)}  synthetic written: ${rv(rc.syntheticWritten)}  pending (grace window): ${rv(rc.pendingWithinGrace)}  reconcile errors: ${rv(rc.reconcileErrors)}`,
      `  Baseline (scope start): ${rv(rc.baseline)}  last poll: ${rv(rc.lastPollAt)}  last error: ${rv(rc.lastError)}`,
      `  DB pairing: opens=${rv(th.dbPairing?.tradeOpens)} closes=${rv(th.dbPairing?.tradeCloses)} live open now=${rv(th.dbPairing?.liveOpenNow)} unaccounted opens (pre-7.2 history)=${rv(th.dbPairing?.unaccountedOpens)}`,
    );
    if (rc.flagEnabled === false)
      push("  [WARN] TELEMETRY_RECONCILER is OFF — OANDA-side closes (SL/TP/manual/margin closeout) are NOT captured.");
    else if (rc.credsPresent === false)
      push("  [WARN] OANDA credentials absent in the server environment — reconciler dormant; completeness derived from DB only.");
    if (typeof th.telemetry_completeness_pct === "number" && th.telemetry_completeness_pct < 100)
      push(`  [WARN] Completeness ${th.telemetry_completeness_pct}% < 100% — ${rv(th.missing_trade_closes)} close(s) awaiting reconciliation (grace window or error retry).`);
  } else push("  N/A — /api/telemetry/health unavailable.");

  // ════════ AI SUMMARY (rule-based, deterministic) ════════
  push(...rptHdr("AI SUMMARY"));
  push("(Deterministic rule-based synthesis — no external AI calls. Compare-to-previous uses the last report generated in this browser.)");

  const liveExp = labVirtual?.live?.expectancy ?? null;
  const liveWR  = labVirtual?.live?.winRate ?? (stats?.winRate!=null ? Number(stats.winRate) : null);
  const engsRanked = (labRanking && labRanking.engines) || [];
  const bestEng = engsRanked.find(e=>e.expectancy!=null) || engsRanked[0] || null;
  const cur = {
    generated: ts,
    liveTrades: labVirtual?.live?.trades ?? stats?.trades ?? null,
    liveWinRate: liveWR!=null && !isNaN(Number(liveWR)) ? Number(liveWR) : null,
    liveExpectancy: liveExp,
    avgAgreement: labComparison?.avgAgreementPct ?? null,
    cautionPct: labComparison?.cautionFlagPct ?? null,
    bestEngineId: bestEng ? (bestEng.id||bestEng.label) : null,
    bestEngineExpectancy: bestEng ? bestEng.expectancy : null,
    knowledgeActive: knActiveCount,
    latestSnapshotId: snaps.length ? snaps[0].id : null,
    selectedConsensus: ctx ? ctx.consensus : null,
    selectedConfidenceTier: ctx && ctx.confidence ? ctx.confidence.tier : null,
  };

  push(...rptSub("WHAT WORKS WELL"));
  {
    const good = [];
    if (cur.liveExpectancy!=null && cur.liveExpectancy>0) good.push(`  Live bot expectancy is positive (${rnum(cur.liveExpectancy,2,"p")}/trade over ${rv(cur.liveTrades)} trades).`);
    if (cur.liveWinRate!=null && cur.liveWinRate>=50) good.push(`  Live win rate is ${rnum(cur.liveWinRate,1,"%")}.`);
    if (cur.avgAgreement!=null && cur.avgAgreement>=70) good.push(`  Shadow engines agree ${rnum(cur.avgAgreement,1,"%")} on average — decision surface is coherent.`);
    if (exitLab?.stats?.totalProfitSaved > 0) good.push(`  Exit Lab shows ${rnum(exitLab.stats.totalProfitSaved,1,"p")} cumulative improvement potential over live exits.`);
    if (cur.knowledgeActive > 0) good.push(`  Knowledge Layer holds ${cur.knowledgeActive} active versioned artifact(s) with provenance and content-only checksums.`);
    if (ctx && ctx.evidenceTrace && ctx.evidenceTrace.checksum) good.push("  Selected Engine produces reproducible, checksummed evidence traces — decisions are fully auditable.");
    if (healthz && healthz.persistence===true) good.push("  PostgreSQL persistence is active — trading knowledge survives redeploys (sacred constraint holds).");
    push(...(good.length?good:["  Not enough data yet to confirm strengths — keep collecting."]));
  }

  push(...rptSub("DEGRADED SINCE PREVIOUS REPORT"));
  if (prev && prev.generated){
    const deg = [];
    const dropped = (a,b,eps)=> a!=null && b!=null && (b-a) > eps;
    if (dropped(cur.liveWinRate, prev.liveWinRate, 2))      deg.push(`  Win rate fell ${rnum(prev.liveWinRate,1,"%")} -> ${rnum(cur.liveWinRate,1,"%")}.`);
    if (dropped(cur.liveExpectancy, prev.liveExpectancy, 0.2)) deg.push(`  Live expectancy fell ${rnum(prev.liveExpectancy,2,"p")} -> ${rnum(cur.liveExpectancy,2,"p")}.`);
    if (dropped(cur.avgAgreement, prev.avgAgreement, 5))    deg.push(`  Engine agreement fell ${rnum(prev.avgAgreement,1,"%")} -> ${rnum(cur.avgAgreement,1,"%")}.`);
    if (cur.cautionPct!=null && prev.cautionPct!=null && (cur.cautionPct-prev.cautionPct) > 5) deg.push(`  Caution-flag rate rose ${rnum(prev.cautionPct,1,"%")} -> ${rnum(cur.cautionPct,1,"%")}.`);
    if (dropped(cur.bestEngineExpectancy, prev.bestEngineExpectancy, 0.2)) deg.push(`  Best engine expectancy fell ${rnum(prev.bestEngineExpectancy,2,"p")} -> ${rnum(cur.bestEngineExpectancy,2,"p")}.`);
    if (cur.knowledgeActive!=null && prev.knowledgeActive!=null && cur.knowledgeActive < prev.knowledgeActive) deg.push(`  Active knowledge artifacts dropped ${prev.knowledgeActive} -> ${cur.knowledgeActive}.`);
    push(...(deg.length?deg:[`  No degradation detected vs previous report (${prev.generated}).`]));
  } else push("  N/A — first v2 report in this browser (baseline saved for next comparison).");

  push(...rptSub("BEST DEVELOPING SHADOW"));
  if (bestEng && bestEng.expectancy!=null){
    push(`  ${bestEng.label||bestEng.id} — rank #${rv(bestEng.rank)}, virtual expectancy ${rnum(bestEng.expectancy,2,"p")}, WR ${rv(bestEng.winRate,"%")}.`);
    if (prev && prev.bestEngineId && prev.bestEngineId !== cur.bestEngineId)
      push(`  Leadership changed: previously ${prev.bestEngineId}, now ${cur.bestEngineId}.`);
    if (labRanking?.dataQualityNote && String(labRanking.dataQualityNote).indexOf("ADEQUATE")!==0)
      push(`  Caveat: ${labRanking.dataQualityNote}`);
  } else push("  N/A — no engine has enough resolved virtual trades to rank reliably.");

  push(...rptSub("KNOWLEDGE LAYER VALUE"));
  {
    const kv = [];
    if (cur.knowledgeActive > 0){
      kv.push(`  ${cur.knowledgeActive} active artifact(s) across domains [${knDomains.join(", ")}].`);
      if (snaps.length>=2){
        const grew = Number(snaps[0].artifact_count||0) - Number(snaps[1].artifact_count||0);
        const changed = snaps[0].manifest_checksum !== snaps[1].manifest_checksum;
        kv.push(changed ? `  Manifest evolved since previous snapshot (artifact delta ${grew>=0?"+":""}${grew}) — knowledge is actively accruing.`
                        : "  Manifest unchanged since previous snapshot — no new research content (idempotent rebuilds, as designed).");
      }
      if (kp && kp.value && kp.value.validatedCount > 0) kv.push(`  ${kp.value.validatedCount} validated pattern(s) already exceed the minimum-sample bar — actionable knowledge exists.`);
      else kv.push("  No validated patterns yet — knowledge is accruing but below the validation sample threshold.");
      kv.push(`  Verdict: ${ (kp?.value?.validatedCount>0 || (snaps.length>=2 && snaps[0].manifest_checksum!==snaps[1].manifest_checksum)) ? "YES — the layer adds measurable value." : "EARLY — infrastructure is sound, value pending more resolved trades."}`);
    } else kv.push("  NOT YET — no active artifacts. Enable KNOWLEDGE_LAYER (or wait for the first build) to start accruing.");
    push(...kv);
  }

  push(...rptSub("SELECTED ENGINE SANITY"));
  if (ctx){
    const sane = [];
    sane.push(`  Consensus ${rv(ctx.consensus)} with confidence tier ${rv(ctx.confidence?.tier)} — reason: ${rv(ctx.selectedReason)}`);
    const topSrc = (ctx.ranking && ctx.ranking[0] && String(ctx.ranking[0].source)) || "";
    const topEng = topSrc.indexOf("engine:")===0 ? topSrc.slice(7) : null;
    const labBest = bestEng ? String(bestEng.id||"").replace("ENGINE_","") : null;
    if (topEng && labBest) sane.push(topEng===labBest
      ? `  CONSISTENT — top-ranked source (engine:${topEng}) matches the Lab's best engine (${labBest}).`
      : `  DIVERGENT — top-ranked source is engine:${topEng} but the Lab ranks ${labBest} best. Rankings use different criteria (confidence-first vs expectancy-only); monitor, not necessarily an error.`);
    sane.push(ctx.evidenceTrace && ctx.evidenceTrace.checksum ? "  Every decision carries a reproducible evidence trace — sanity is verifiable, not asserted." : "  WARNING: no evidence trace present.");
    sane.push("  Verdict: decisions are reasoned, read-only, and never influence trading (by design).");
    push(...sane);
  } else push("  N/A — no DecisionContext available yet.");

  push(...rptSub("WOULD SELECTED HAVE HELPED?"));
  {
    const wl = [];
    // Sprint 7 Phase 1: join REAL executed & closed trades with advisor
    // opinions by signalId. STRICTLY retrospective filtering of trades the
    // bot actually took — NO simulated entries are ever added.
    const advBySignal = {};
    for (const a of advList){
      if (a.signalId && advStatusOf(a)==="OK" && !advBySignal[a.signalId]) advBySignal[a.signalId] = a;
    }
    const joined = [];
    for (const t of (Array.isArray(trades) ? trades : [])){
      if (!t || !t.open || !t.close) continue;             // only closed, real trades
      // /api/trades pairs close→open by symbol + timestamp; when the close
      // event carries its own signalId, require an exact match to avoid
      // attributing another trade's outcome to this advisory.
      if (t.close.signalId && t.open.signalId && t.close.signalId !== t.open.signalId) continue;
      const a = t.open.signalId ? advBySignal[t.open.signalId] : null;
      if (!a) continue;                                     // no Selected opinion for this trade
      const d = t.close;
      const p = Number(d.profitPips);
      const outcome = d.outcome ? String(d.outcome).toUpperCase()
        : (isNaN(p) ? null : (p < 0 ? "LOSS" : (p <= 1 ? "BREAKEVEN" : "WIN")));
      if (!outcome) continue;
      joined.push({ outcome, pips: isNaN(p) ? null : p,
        decision: a.selectedDecision,
        tier: a.selectedConfidence ? a.selectedConfidence.tier : null });
    }
    if (!joined.length){
      wl.push("  N/A — no closed trades could be joined with Selected opinions yet (in-memory advisory ring resets on restart; needs SHADOW_LAB_RESEARCH=on for non-stub opinions).");
    } else {
      const jWins   = joined.filter(j=>j.outcome==="WIN");
      const jLosses = joined.filter(j=>j.outcome==="LOSS");
      const lossesNoTrade     = jLosses.filter(j=>j.decision==="NO_TRADE");
      const lossesNoTradeHigh = lossesNoTrade.filter(j=>j.tier==="HIGH");
      const winsRejected      = jWins.filter(j=>j.decision==="NO_TRADE");
      wl.push(`  Basis: ${joined.length} REAL executed & closed trade(s) with a Selected opinion — retrospective filter only, no simulated entries.`);
      wl.push(`  Losses where Selected said NO_TRADE: ${lossesNoTrade.length}/${jLosses.length}${jLosses.length?` (${(lossesNoTrade.length/jLosses.length*100).toFixed(1)}%)`:""} — of which HIGH confidence: ${lossesNoTradeHigh.length}`);
      wl.push(`  Profits that would have been rejected (WIN but Selected said NO_TRADE): ${winsRejected.length}/${jWins.length}`);
      const kept = joined.filter(j=>j.decision!=="NO_TRADE");
      const wrOf  = (arr)=>{ const w=arr.filter(j=>j.outcome==="WIN").length, l=arr.filter(j=>j.outcome==="LOSS").length; return (w+l) ? (w/(w+l)*100) : null; };
      const expOf = (arr)=>{ const withP=arr.filter(j=>j.pips!=null); return withP.length ? withP.reduce((s,j)=>s+j.pips,0)/withP.length : null; };
      const wr0=wrOf(joined), wr1=wrOf(kept), e0=expOf(joined), e1=expOf(kept);
      wl.push(`  Potential Win Rate impact (same trades, NO_TRADE-flagged removed): ${wr0==null?"N/A":wr0.toFixed(1)+"%"} -> ${wr1==null?"N/A":wr1.toFixed(1)+"%"}${(wr0!=null&&wr1!=null)?` (${wr1-wr0>=0?"+":""}${(wr1-wr0).toFixed(1)} pp)`:""}`);
      wl.push(`  Potential Expectancy impact (avg pips/trade): ${e0==null?"N/A":e0.toFixed(2)} -> ${e1==null?"N/A":e1.toFixed(2)}${(e0!=null&&e1!=null)?` (${e1-e0>=0?"+":""}${(e1-e0).toFixed(2)})`:""}`);
      wl.push(`  Verdict: ${
        (lossesNoTrade.length===0 && winsRejected.length===0)
          ? "NEUTRAL — Selected agreed with every executed trade in this window."
          : (e0!=null && e1!=null && e1>e0 && lossesNoTradeHigh.length>0)
            ? "PROMISING — filtering Selected NO_TRADE trades would have improved expectancy, incl. HIGH-confidence loss flags."
            : (e0!=null && e1!=null && e1>e0)
              ? "SLIGHTLY POSITIVE — expectancy would have improved, but without HIGH-confidence loss flags yet."
              : "MIXED — filtering would not have improved expectancy in this window; more joined trades needed for a reliable read."}`);
    }
    push(...wl);
  }

  push(...rptSub("NEXT SPRINT RECOMMENDATIONS"));
  {
    const rec = [];
    if (labRanking?.dataQualityNote && String(labRanking.dataQualityNote).indexOf("INSUFFICIENT")===0)
      rec.push("  1. PRIORITY: keep collecting closed trades — every ranking/expectancy verdict is unreliable below 50 resolved trades.");
    if (research && research.researchEnabled===false) rec.push(`  ${rec.length+1}. Enable SHADOW_LAB_RESEARCH so the research reconciler persists signals/evals/outcomes continuously.`);
    if (knStatus && knStatus.knowledgeEnabled===false) rec.push(`  ${rec.length+1}. Enable KNOWLEDGE_LAYER so artifacts refresh on the 15-min cycle instead of staying frozen.`);
    if (selStatus && selStatus.running===false) rec.push(`  ${rec.length+1}. Consider enabling SELECTED_ENGINE background refresh for a warm DecisionContext ring.`);
    if (cur.cautionPct!=null && cur.cautionPct>30) rec.push(`  ${rec.length+1}. Investigate engine disagreement — caution-flag rate ${rnum(cur.cautionPct,1,"%")} exceeds 30%.`);
    if (pipeline && pipeline.silentLeakage>0) rec.push(`  ${rec.length+1}. Close the telemetry gap: silent leakage of ${pipeline.silentLeakage} signal(s) between block arithmetic and gate checks.`);
    rec.push(`  ${rec.length+1}. Proceed with Sprint 7 (RecoveryManager + ValidationManager) — the next planned SHADOW OS v2 milestone.`);
    push(...rec);
  }

  push("", "=".repeat(RPT_W), "END OF REPORT — AI COMPLETE ANALYSIS REPORT v2", "=".repeat(RPT_W), "");
  return { lines: L, metrics: cur };
}

// ── EXPORT tab ───────────────────────────────────────────────────────────────
function ExportTab(){
  const [loading, setLoading] = useState(false);
  const [status,  setStatus]  = useState("");

  function downloadFile(content, filename, mime){
    const blob = new Blob([content], { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
  }

  function dlRaw(format){ window.open(`/api/export?format=${format}&date=today`,"_blank"); }

  async function generateReport(){
    setLoading(true); setStatus("Generating AI Complete Analysis Report v2…");
    try {
      const failures = [];
      const timings  = {};
      // Retry transient HTTP errors: a Railway-edge 502/timeout during a burst
      // of heavy scans usually succeeds on a quieter retry. 404 is an EXPECTED
      // contract (knowledge artifact not built yet) — absent data, no retry,
      // NOT a failure (keeps the failures.length <= 5 baseline-save guard).
      const RETRY_BACKOFF_MS = [600, 1800]; // attempt 1 → wait 600ms, attempt 2 → 1800ms
      const safe = async (path) => {
        const s = Date.now();
        for (let attempt = 0; ; attempt++) {
          try {
            const r = await fetch(path);
            // Non-2xx responses (e.g. proxy 502 JSON error documents) must NOT
            // be treated as data — they crash array consumers like syms.map.
            if (!r.ok) {
              if (r.status === 404) { timings[path] = Date.now()-s; return null; }
              if (attempt < RETRY_BACKOFF_MS.length) {
                await new Promise(res => setTimeout(res, RETRY_BACKOFF_MS[attempt]));
                continue;
              }
              timings[path] = Date.now()-s;
              failures.push(`${path} — HTTP ${r.status}`);
              return null;
            }
            const j = await r.json(); timings[path] = Date.now()-s; return j;
          }
          catch(e){
            if (attempt < RETRY_BACKOFF_MS.length) {
              await new Promise(res => setTimeout(res, RETRY_BACKOFF_MS[attempt]));
              continue;
            }
            timings[path] = Date.now()-s; failures.push(`${path} — ${e.message}`); return null;
          }
        }
      };

      // Fetch a batch with LIMITED parallelism (results in input order).
      // The endpoints behind this report share one pg pool (max 10 connections,
      // 5s connection timeout) with the live bot. Firing 6 heavy event-scans at
      // once can exhaust the pool → slow queries → Railway edge 502s. Two at a
      // time keeps the report reliable without starving the bot's own queries.
      const fetchLimited = async (paths, limit) => {
        const out = new Array(paths.length);
        let next = 0;
        const worker = async () => {
          while (next < paths.length) { const i = next++; out[i] = await safe(paths[i]); }
        };
        await Promise.all(Array.from({ length: Math.min(limit || 2, paths.length) }, worker));
        return out;
      };

      setStatus("Fetching… (1/6) live bot");
      const [stats,today,syms,ins,blocked,quality] = await fetchLimited([
        "/api/stats","/api/today","/api/symbols",
        "/api/insights","/api/blocked-outcomes","/api/trade-quality",
      ], 2);
      setStatus("Fetching… (2/6) shadow lab core");
      const [labOverview,unified,labComparison,labRanking,labVirtual,shadowStatus] = await fetchLimited([
        "/api/lab/overview","/api/lab/unified-report","/api/lab/comparison",
        "/api/lab/engine-ranking","/api/lab/virtual-performance","/api/shadow/status",
      ], 2);
      setStatus("Fetching… (3/6) shadow engines + exit lab");
      const [shA,shB,shC,shD,exitLab,research] = await fetchLimited([
        "/api/lab/shadow-a","/api/lab/shadow-b","/api/lab/shadow-c",
        "/api/lab/shadow-d","/api/shadowm/dashboard","/api/lab/research/summary",
      ], 2);
      setStatus("Fetching… (4/6) knowledge layer");
      const [knStatus,knArtifacts,knSnapshots,knConfidence,knExpectancy,knExperiments] = await fetchLimited([
        "/api/knowledge/status","/api/knowledge/artifacts","/api/knowledge/snapshots?limit=10",
        "/api/knowledge/artifacts/confidence/history","/api/knowledge/artifacts/expectancy/history",
        "/api/knowledge/artifacts/experiments/metadata",
      ], 3);
      setStatus("Fetching… (5/6) knowledge details + selected engine");
      const [knFingerprints,knPatterns,selStatus,selContext,pipeline,healthz] = await fetchLimited([
        "/api/knowledge/artifacts/market/fingerprints","/api/knowledge/artifacts/patterns/validated",
        "/api/selected/status","/api/selected/context",
        "/api/pipeline-audit","/api/healthz/persistence",
      ], 2);
      setStatus("Fetching… (6/6) memory integration + selected advisor + telemetry health");
      const [memInteg, advisories, trades, telemetryHealth] = await fetchLimited([
        "/api/memory-integration/status",
        "/api/selected/advisories?limit=100",
        "/api/trades",
        "/api/telemetry/health",
      ], 2);

      setStatus("Assembling report…");
      let prev = null;
      try { prev = JSON.parse(localStorage.getItem("forex_ai_report_v2_prev") || "null"); } catch(_){}

      const ts = new Date().toISOString();
      const { lines, metrics } = buildReportV2({
        ts, stats, today, syms, ins, blocked, quality,
        labOverview, unified, labComparison, labRanking, labVirtual, shadowStatus,
        shA, shB, shC, shD, exitLab, research,
        knStatus, knArtifacts, knSnapshots, knConfidence, knExpectancy, knExperiments, knFingerprints, knPatterns,
        selStatus, selContext, pipeline, healthz, memInteg,
        advisories, trades, telemetryHealth,
        failures, timings, prev,
      });

      // Save the comparison baseline only when the fetch pass was mostly healthy —
      // a heavily-failed run must not overwrite a good baseline with nulls.
      if (failures.length <= 5) {
        try { localStorage.setItem("forex_ai_report_v2_prev", JSON.stringify(metrics)); } catch(_){}
      }

      const fn = `ai_analysis_report_v2_${ts.slice(0,19).replace(/:/g,"-")}.txt`;
      downloadFile(lines.join("\n"), fn, "text/plain");
      setStatus(failures.length
        ? `Report downloaded (${failures.length} endpoint(s) unavailable — marked N/A inside the report).`
        : "Report downloaded.");
    } catch(e){ setStatus("Error: "+e.message); }
    setLoading(false);
  }

  async function generateSnapshot(){
    setLoading(true);
    try {
      setStatus("Fetching… (1/4)");
      const [stats,today,syms,trades,fps] = await Promise.all([
        api("/api/stats"),api("/api/today"),api("/api/symbols"),api("/api/trades"),api("/api/fingerprints"),
      ]);
      setStatus("Fetching… (2/4)");
      const [exc,blocked,ins,drift,quality,pef] = await Promise.all([
        api("/api/excursion"),api("/api/blocked-outcomes"),api("/api/insights"),
        api("/api/drift"),api("/api/trade-quality"),api("/api/post-entry-failures"),
      ]);
      setStatus("Fetching… (3/4)");
      const [almost,v2,condPerf,exitMgr] = await Promise.all([
        api("/api/almost-trades"),api("/api/blocked-winners-v2"),
        api("/api/condition-performance"),api("/api/exit-manager"),
      ]);
      setStatus("Fetching… (4/4)");
      const [m5exp,m1exp,m1close,gate,pipeline] = await Promise.all([
        api("/api/m5trend-experiment"),api("/api/m1trend-experiment"),
        api("/api/m1close-experiment"),api("/api/gate-experiment"),api("/api/pipeline-audit"),
      ]);
      setStatus("Fetching… (5/5)");
      const [spreadEdgeSnap, cooldownAnaSnap] = await Promise.all([
        api("/api/spread-edge-analysis"),
        api("/api/cooldown-analysis"),
      ]);
      setStatus("Assembling snapshot…");
      const snapshot = {
        meta:{ generated:new Date().toISOString(), version:"v39.3", source:"analysis_snapshot" },
        performance:{ stats, today },
        symbols: syms, trades, patterns: fps, excursion: exc,
        blocked_outcomes: blocked, insights: ins, drift,
        trade_quality: quality, post_entry_failures: pef,
        almost_trades: almost, blocked_winners_v2: v2,
        condition_performance: condPerf, exit_manager: exitMgr,
        spread_edge_analysis: spreadEdgeSnap, cooldown_analysis: cooldownAnaSnap,
        experiments:{ m5trend:m5exp, m1trend:m1exp, m1close, gate },
        pipeline,
      };
      const fn = `analysis_snapshot_${new Date().toISOString().slice(0,19).replace(/:/g,"-")}.json`;
      downloadFile(JSON.stringify(snapshot,null,2), fn, "application/json");
      setStatus("Snapshot downloaded.");
    } catch(e){ setStatus("Error: "+e.message); }
    setLoading(false);
  }

  return (
    <div className="page">
      <div className="panel">
        <div className="ph">EXPORT — Download Telemetry Data</div>
        <div style={{padding:16}}>
          <div className="sec-label">Raw Event Data (today)</div>
          <div style={{display:"flex",gap:10,marginBottom:16}}>
            <button className="btn" onClick={()=>dlRaw("json")}>⬇ Download JSON</button>
            <button className="btn" onClick={()=>dlRaw("csv")}>⬇ Download CSV</button>
          </div>

          <div className="sec-divider"/>
          <div className="sec-label">AI Complete Analysis Report v2</div>
          <div style={{color:"#8b949e",fontSize:11,marginBottom:10}}>
            One full architectural report (<code style={{color:"#79c0ff"}}>.txt</code>): LIVE BOT (unchanged summary) + SHADOW LAB (engines A–D, ranking, virtual performance, Exit Lab) + KNOWLEDGE LAYER (artifacts, snapshots, growth) + SELECTED ENGINE (DecisionContext, consensus, evidence trace) + SELECTED ADVISOR ANALYSIS (observational opinions per live trade) + PIPELINE HEALTH + rule-based AI SUMMARY (incl. "WOULD SELECTED HAVE HELPED?") with next-sprint recommendations. Read-only — assembled from existing endpoints.
          </div>
          <div style={{display:"flex",gap:10,marginBottom:16}}>
            <button className="btn primary" onClick={generateReport} disabled={loading}>
              {loading?"Working…":"⬇ Download Analysis Report"}
            </button>
          </div>

          <div className="sec-divider"/>
          <div className="sec-label">Full Analysis Snapshot (for AI)</div>
          <div style={{color:"#8b949e",fontSize:11,marginBottom:10}}>
            Fetches all 18 API endpoints and packages them as <code style={{color:"#79c0ff"}}>analysis_snapshot_TIMESTAMP.json</code> — trades, patterns, fingerprints, excursion, blocked outcomes, post-entry failures, condition performance, exit manager, blocked winners v2, spread edge analysis, cooldown analysis, session stats, experiment data, pipeline audit.
          </div>
          <div style={{display:"flex",gap:10,marginBottom:16}}>
            <button className="btn primary" onClick={generateSnapshot} disabled={loading}>
              {loading?"Working…":"⬇ Generate Snapshot"}
            </button>
          </div>

          {status && <div style={{fontSize:12,color:status.startsWith("Error")?"#f85149":"#3fb950",marginTop:4}}>{status}</div>}
        </div>
      </div>
    </div>
  );
}

const CHART_OPTS_BASE = {
  responsive:true,
  maintainAspectRatio:true,
  plugins:{ legend:{ labels:{ color:"#8b949e", font:{size:11} } } },

function EquityChart({ trades }){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current||!trades.length) return;
    if(chartRef.current) chartRef.current.destroy();
    let cum=0;
    const points = trades
      .filter(t=>t.close)
      .sort((a,b)=>a.open.timestamp>b.open.timestamp?1:-1)
      .map(t=>{ cum+=t.close.profitPips||0; return {x:hm(t.close.timestamp||t.open.timestamp),y:parseFloat(cum.toFixed(2))}; });
    chartRef.current = new Chart(ref.current, {
      type:"line",
      data:{ labels:points.map(p=>p.x), datasets:[{
        label:"Cumulative pips", data:points.map(p=>p.y),
        borderColor:"#58a6ff", backgroundColor:"rgba(88,166,255,.08)",
        tension:.3, pointRadius:2, fill:true,
      }]},
      options:{ ...CHART_OPTS_BASE, plugins:{...CHART_OPTS_BASE.plugins, legend:{display:false}} },
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[trades]);
  if(!trades.length) return <div className="empty">No closed trades yet</div>;
  return <canvas ref={ref}/>;
}

function BarChart({ labels, values, color="#58a6ff", label="Value", extra={} }){
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if(!ref.current||!labels.length) return;
    if(chartRef.current) chartRef.current.destroy();
    const baseOpts = { ...CHART_OPTS_BASE, plugins:{...CHART_OPTS_BASE.plugins, legend:{display:false}} };
    function deepMerge(a, b){
      const out = {...a};
      for(const k of Object.keys(b||{})){
        if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")
          out[k] = deepMerge(a[k], b[k]);
        else out[k] = b[k];
      }
      return out;
    }
    chartRef.current = new Chart(ref.current, {
      type:"bar",
      data:{ labels, datasets:[{ label, data:values, backgroundColor:color, borderRadius:4 }]},
      options: deepMerge(baseOpts, extra),
    });
    return ()=>{ if(chartRef.current) chartRef.current.destroy(); };
  },[labels,values,color,label,extra]);
  if(!labels.length) return <div className="empty">No data</div>;
  return <canvas ref={ref}/>;
}

function WinRateChart({ title, buckets, noDataMsg }){
  if(!buckets||buckets.length===0) return (

    </div>

  const labels = buckets.map(b=>b.key);
  const values = buckets.map(b=>b.winRate);
  const counts = buckets.map(b=>b.trades);
  const colors = values.map(v=>v>=50?"rgba(63,185,80,.7)":"rgba(248,81,73,.7)");
  return (

        labels={labels}

        extra={{

          scales:{ y:{ min:0, max:100, ticks:{ callback: v=>v+"%" } } }

}

                </tr>
              );
            })}
          </tbody></table>
        )}

        <div className="ph">All-Time Block Breakdown</div>

          {blockBreakdown.length===0 ? <div className="empty">No blocks logged</div> : blockBreakdown.map((b,i)=>{
            const total = blockBreakdown.reduce((s,x)=>s+x.count,0);

            return (
              <div className="bar-row" key={i}>
                <div className="blbl">{b.type.replace(/_block/,"").replace(/_/," ")}</div>

      <div className="panel">

      {/* ── M1 Trend Experiment (Project Snowball) ── */}

                    <td style={{fontFamily:"monospace",fontWeight:600,color:isExp?"#d29922":"#8b949e"}}>{g.label}</td>

              ⏳ Experiment group has {m1exp.groupB?.trades||0} trades — need ≥20 for statistical significance. Keep collecting.
            </div>

      {/* ── M5 Trend Experiment (Project Snowball) ── */}
      {m5exp && (
        <div className="panel">
          <div className="ph">

            </span>
          </div>
          <table>
            <thead><tr>
              <th>Group</th><th>Trades</th><th>W/L</th><th>Win Rate</th>
              <th>Avg Pips</th><th>Avg MFE</th><th>Avg MAE</th><th>Exit Eff %</th>
            </tr></thead>
            <tbody>
              {[m5exp.groupA, m5exp.groupB].map((g,i)=>{
                if (!g) return null;
                const isExp   = i === 1;
                const wr      = parseFloat(g.winRate);
                const wrBase  = parseFloat(m5exp.groupA?.winRate||"0");
                const wrColor = isExp ? (wr >= wrBase ? "#3fb950" : wr >= wrBase - 5 ? "#d29922" : "#f85149") : "#e6edf3";
                return (
                  <tr key={i}>
                    <td style={{fontFamily:"monospace",fontWeight:600,color:isExp?"#d29922":"#8b949e"}}>{g.label}</td>

            </tbody>
          </table>
          {(m5exp.groupB?.trades||0) < 20 && (
            <div style={{padding:"8px 16px",fontSize:11,color:"#484f58",borderTop:"1px solid #30363d"}}>
              ⏳ Experiment group has {m5exp.groupB?.trades||0} trades — need ≥20 for statistical significance. Keep collecting.
            </div>
          )}
        </div>
      )}

      {/* ── M1Close Experiment (Project Snowball) ── */}
      {m1closeExp && (
        <div className="panel">
          <div className="ph">
            M1Close Experiment — A/B Comparison
            <span style={{fontWeight:400,color:"#484f58"}}>
              m1close=TRUE (baseline) vs m1close=FALSE (experiment entries). Min 20 trades per group.
            </span>
          </div>
          <table>
            <thead><tr>
              <th>Group</th><th>Trades</th><th>W/L</th><th>Win Rate</th>
              <th>Avg Pips</th><th>Avg MFE</th><th>Avg MAE</th><th>Exit Eff %</th>
            </tr></thead>
            <tbody>
              {[m1closeExp.groupA, m1closeExp.groupB].map((g,i)=>{
                if (!g) return null;
                const isExp   = i === 1;
                const wr      = parseFloat(g.winRate);
                const wrBase  = parseFloat(m1closeExp.groupA?.winRate||"0");
                const wrColor = isExp ? (wr >= wrBase ? "#3fb950" : wr >= wrBase - 5 ? "#d29922" : "#f85149") : "#e6edf3";

                    <td style={{fontFamily:"monospace",fontWeight:600,color:isExp?"#d29922":"#8b949e"}}>{g.label}</td>
